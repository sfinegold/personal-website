<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outside Lands 2026 — Planner</title>
<link rel="icon" type="image/svg+xml" href="/outside-lands/favicon.svg">
<meta name="description" content="Set times for Outside Lands 2026 with 30-second previews and shared picks.">
<meta property="og:title" content="Outside Lands 2026 — Planner">
<meta property="og:description" content="All three days, every stage. Preview any artist, and plan alongside your friends.">
<meta property="og:image" content="https://samfinegold.me/outside-lands/share.png">
<meta property="og:url" content="https://samfinegold.me/outside-lands">
<meta name="twitter:card" content="summary_large_image">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* Light: warm paper, eucalyptus, fog — Golden Gate Park in August. */
    --bg:#F7F5F0; --bg2:#EEEAE1; --card:rgba(28,32,38,.035); --line:rgba(28,32,38,.13);
    --text:#191D23; --dim:rgba(25,29,35,.62); --faint:rgba(25,29,35,.38);
    --accent:#4A6E8F; --accent-hi:#33556F; --gold:#A8761E; --pick:#3B7A5C;
    --on-accent:#F7F5F0;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ppm:1.7;                       /* pixels per minute of festival time */
    --colw:116px; --personw:100px; --gutter:44px;
  }
  body{background:var(--bg);color:var(--text);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    letter-spacing:.01em}
  a{color:var(--accent-hi)}
  :focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  header{padding:1.5rem 1.25rem .9rem;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:40}
  .kick{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);margin-bottom:.35rem}
  h1{font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
  .brand{display:flex;align-items:center;gap:.7rem}
  .mark{border-radius:8px;flex:none;display:block}
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
  .tabs{display:flex;gap:.3rem;background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:.2rem}
  .tab{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
    padding:.4rem .8rem;border:0;border-radius:6px;background:transparent;color:var(--dim);
    cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
  .who{display:flex;gap:.4rem;align-items:center;margin-left:auto;flex-wrap:wrap}
  .who label{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint)}
  select,input[type=text]{background:var(--bg2);color:var(--text);border:1px solid var(--line);
    border-radius:7px;padding:.42rem .6rem;font-size:.85rem;font-family:inherit}
  .btn{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
    padding:.45rem .75rem;border-radius:7px;border:1px solid var(--accent);background:transparent;
    color:var(--accent-hi);cursor:pointer}
  .btn:hover{background:var(--accent);color:var(--on-accent)}
  .btn.ghost{border-color:var(--line);color:var(--dim)}
  .btn.ghost:hover{background:var(--card);color:var(--text)}
  .hint{font-size:.78rem;color:var(--faint);margin-top:.6rem}
  .hint b{color:var(--dim)}

  /* ---------- grid ---------- */
  /* Page scrolls vertically so a day runs to its last artist before the next
     begins. The header row therefore CANNOT live inside the horizontally
     scrolling grid — a sticky-top there would have nothing to stick to. It sits
     outside as its own strip and mirrors the grid's scrollLeft. */
  .wrap{overflow-x:auto;overflow-y:visible;position:relative}
  .headbar{position:sticky;top:var(--hh,132px);z-index:35;overflow:hidden;
    background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .headrow{display:flex;min-width:max-content;will-change:transform}
  .headrow .col{border-right:1px solid var(--line);flex:none;width:var(--colw)}
  .headrow .col.gut{width:var(--gutter)}
  .headrow .col.person{width:var(--personw);background:rgba(59,122,92,.09)}
  .headrow .col.person.active{background:rgba(59,122,92,.18)}
  .dayrow{position:absolute;left:0;height:var(--divh);display:flex;align-items:center;
    background:var(--bg2);border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);z-index:12}
  .dayrow .lab{position:sticky;left:0;display:flex;align-items:baseline;gap:.55rem;
    padding:0 .7rem;white-space:nowrap;background:var(--bg2)}
  .dayrow .n{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold)}
  .dayrow h2{font-size:.92rem;font-weight:600}
  .dayrow .cnt{font-family:var(--mono);font-size:.6rem;color:var(--faint)}
  /* MUST stay: without display:flex the columns stack as blocks and the
     stage columns fall off-screen. position:relative anchors .dayrow. */
  .grid{display:flex;min-width:max-content;position:relative}
  .col{flex:none;width:var(--colw);border-right:1px solid var(--line);position:relative}
  .col.gut{width:var(--gutter);position:sticky;left:0;background:var(--bg);z-index:22}
  .col.person{width:var(--personw);background:rgba(59,122,92,.06)}
  .col.person.active{background:rgba(59,122,92,.13)}
  .head{height:44px;display:flex;align-items:center;justify-content:center;gap:.3rem;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);
    z-index:18;padding:0 .4rem;text-align:center;box-shadow:0 1px 0 var(--line)}
  .col.gut .head{background:var(--bg);z-index:30}
  .head .nm{font-family:var(--mono);font-size:.57rem;letter-spacing:.04em;text-transform:uppercase;
    color:var(--dim);line-height:1.15;overflow:hidden}
  .col.person .head .nm{color:var(--pick)}
  .head .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:.85rem;padding:0 2px}
  .head .x:hover{color:#C0392B}
  .body{position:relative}
  .hr{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.5}
  .hr.half{opacity:.2}
  .tick{position:absolute;right:5px;font-family:var(--mono);font-size:.58rem;color:var(--faint);
    transform:translateY(-50%)}

  .blk{position:absolute;left:3px;right:3px;border-radius:6px;padding:.28rem .35rem;
    background:#fff;border:1px solid rgba(28,32,38,.16);border-left:3px solid var(--h,#4A6E8F);
    box-shadow:0 1px 2px rgba(28,32,38,.06);
    overflow:hidden;cursor:pointer;transition:background .12s}
  .blk:hover{background:#F1EDE5;border-color:rgba(28,32,38,.3)}
  .blk .a{font-size:.67rem;font-weight:600;line-height:1.15;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .blk .t{font-family:var(--mono);font-size:.55rem;color:var(--faint);margin-top:1px}
  .blk .add{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:4px;
    border:1px solid rgba(28,32,38,.2);background:#F4F1EA;color:var(--dim);font-size:.72rem;
    line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
  .blk .add:hover{background:var(--pick);border-color:var(--pick);color:#fff}
  .blk.picked{border-color:var(--pick);background:#E3F0E8}
  .blk.picked .add{background:var(--pick);border-color:var(--pick);color:#fff}
  .blk.playing{box-shadow:0 0 0 2px var(--gold) inset}
  .blk.tiny .t{display:none}
  .blk.tiny .a{-webkit-line-clamp:1;font-size:.62rem}
  .pblk{position:absolute;left:3px;right:3px;border-radius:6px;padding:.25rem .35rem;
    background:#DCEDE3;border:1px solid rgba(59,122,92,.5);overflow:hidden}
  .pblk .a{font-size:.64rem;font-weight:600;line-height:1.15;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pblk .t{font-family:var(--mono);font-size:.55rem;color:var(--faint)}
  .pblk.clash{border-color:#C0392B;background:#F8E2DE}

  /* ---------- now playing ---------- */
  .np{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);
    padding:.6rem 1rem;display:none;align-items:center;gap:.8rem;z-index:60}
  .np.on{display:flex}
  .np img{width:38px;height:38px;border-radius:5px;background:var(--card);flex:none}
  .np .m{min-width:0;flex:1}
  .np .m b{display:block;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np .m span{font-size:.72rem;color:var(--faint)}
  .np .st{font-family:var(--mono);font-size:.65rem;color:var(--gold)}
  .toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--bg2);
    border:1px solid var(--line);border-radius:8px;padding:.5rem .9rem;font-size:.82rem;
    z-index:70;display:none}
  .toast.on{display:block}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="mark" src="/outside-lands/favicon.svg" alt="" width="34" height="34">
    <div>
      <div class="kick">Golden Gate Park · Aug 7–9</div>
      <h1>Outside Lands 2026 — planner</h1>
    </div>
  </div>
  <div class="bar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="who">
      <label for="me">You are</label>
      <select id="me"></select>
      <input type="text" id="newname" placeholder="add a name" maxlength="24" size="12">
      <button class="btn" id="addBtn">Add column</button>
      <button class="btn ghost" id="refresh">Refresh</button>
    </div>
  </div>
  <p class="hint">Click an artist to hear a <b>30-second preview</b>. Hit <b>+</b> to add them to
    your column on the left. Everyone's picks are shared — add a column for each friend.
    A <b>red</b> block in someone's column means they double-booked themselves.</p>
</header>

<div class="headbar" id="headbar"><div class="headrow" id="headrow"></div></div>
<div class="wrap" id="wrap"><div class="grid" id="grid"></div></div>

<div class="np" id="np">
  <img id="npArt" alt="">
  <div class="m"><b id="npTitle">—</b><span id="npArtist"></span></div>
  <span class="st" id="npState">loading…</span>
  <button class="btn ghost" id="npStop">Stop</button>
</div>
<div class="toast" id="toast"></div>

<audio id="audio"></audio>
<script src="/outside-lands/schedule.js"></script>
<script>
const API='/api/outside-lands';
const HUES=['#A8761E','#3F6485','#3B7A5C','#A34E60','#6E4E9E','#22758A','#B3561A','#525C6B'];
let DAY=0, STATE={people:[]}, ME=localStorage.getItem('ol_me')||null, PLAYING=null;

const T0=705, T1=1320;                       // minutes: 11:45am -> 10pm
const ppm=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ppm'));
const y=m=>(m-T0)*ppm();
const key=(d,st,a,s)=>`${d}|${st}|${a}|${s}`;
const label=m=>{const h=Math.floor(m/60),x=h%12||12;return x+(m%60?':'+String(m%60).padStart(2,'0'):'')+(h<12?'am':'pm');};

/* ---------------- data helpers ---------------- */
function allSets(di){
  const out=[]; OL.days[di].stages.forEach(st=>st.sets.forEach(s=>
    out.push({...s, stage:st.name, k:key(di,st.name,s.a,s.s)}))); return out;
}
const meObj=()=>STATE.people.find(p=>p.id===ME)||null;

/* ---------------- API ---------------- */
async function pull(){
  try{ const r=await fetch(API); if(r.ok){ STATE=await r.json(); reconcile(); render(); } }
  catch(e){ toast('Offline — picks not syncing'); }
}
async function act(body){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){ toast(j.error||'Failed'); return; }
    STATE=j; reconcile(); render();
  }catch(e){ toast('Could not save'); }
}
function reconcile(){
  if(!STATE.people.some(p=>p.id===ME)) ME=STATE.people[0]?STATE.people[0].id:null;
  if(ME) localStorage.setItem('ol_me',ME);
}

/* ---------------- preview ---------------- */
const audio=document.getElementById('audio');
async function playFor(name,blk){
  const np=document.getElementById('np');
  document.querySelectorAll('.blk.playing').forEach(b=>b.classList.remove('playing'));
  blk.classList.add('playing');
  np.classList.add('on');
  document.getElementById('npTitle').textContent=name;
  document.getElementById('npArtist').textContent='';
  document.getElementById('npArt').removeAttribute('src');
  document.getElementById('npState').textContent='loading…';
  try{
    const r=await fetch(API+'?preview='+encodeURIComponent(name));
    const j=await r.json();
    if(!j||!j.previewUrl){ document.getElementById('npState').textContent='no preview'; return; }
    audio.src=j.previewUrl; await audio.play();
    document.getElementById('npState').textContent='playing';
    document.getElementById('npTitle').textContent=j.artist||name;
    document.getElementById('npArtist').textContent=j.track||'';
    if(j.artwork) document.getElementById('npArt').src=j.artwork;
    PLAYING=name;
  }catch(e){ document.getElementById('npState').textContent='no preview'; }
}
document.getElementById('npStop').onclick=()=>{
  audio.pause(); document.getElementById('np').classList.remove('on');
  document.querySelectorAll('.blk.playing').forEach(b=>b.classList.remove('playing'));
};
audio.addEventListener('ended',()=>{document.getElementById('npState').textContent='ended';});

let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}

/* ---------------- render ---------------- */
const DIVH=46;
const dayH=()=>(T1-T0)*ppm();
const dayTop=i=>i*(dayH()+DIVH)+DIVH;
const totalH=()=>OL.days.length*(dayH()+DIVH);
const STAGE_LABEL=i=>i===5?"Dolores'":OL.days[0].stages[i].name;

/* ---- columns (each spans all three days) ---- */
function timeCol(){
  const c=document.createElement('div'); c.className='col gut';
  const b=document.createElement('div'); b.className='body'; b.style.height=totalH()+'px';
  OL.days.forEach((d,di)=>{
    for(let m=720;m<=1320;m+=30){
      const l=document.createElement('div'); l.className='hr'+(m%60?' half':'');
      l.style.top=(dayTop(di)+(m-T0)*ppm())+'px'; b.appendChild(l);
      if(m%60===0){const t=document.createElement('div'); t.className='tick';
        t.style.top=(dayTop(di)+(m-T0)*ppm())+'px'; t.textContent=label(m); b.appendChild(t);}
    }
  });
  c.appendChild(b); return c;
}
function personCol(p){
  const c=document.createElement('div'); c.className='col person'+(p.id===ME?' active':'');
  const b=document.createElement('div'); b.className='body'; b.style.height=totalH()+'px';
  OL.days.forEach((d,di)=>{
    const mine=allSets(di).filter(x=>(p.picks||[]).includes(x.k));
    mine.forEach(x=>{
      const clash=mine.some(o=>o!==x && o.s<x.e && x.s<o.e);
      const el=document.createElement('div'); el.className='pblk'+(clash?' clash':'');
      el.style.top=(dayTop(di)+(x.s-T0)*ppm())+'px';
      el.style.height=Math.max(20,(x.e-x.s)*ppm()-3)+'px';
      el.innerHTML=`<div class="a">${esc(x.a)}</div><div class="t">${x.st}</div>`;
      el.title=x.a+' · '+x.stage+' · '+x.st+'–'+x.et+(clash?'  ⚠ overlaps another pick':'');
      b.appendChild(el);
    });
  });
  c.appendChild(b); return c;
}
function stageCol(si){
  const c=document.createElement('div'); c.className='col';
  const hue=HUES[si%HUES.length];
  const b=document.createElement('div'); b.className='body'; b.style.height=totalH()+'px';
  OL.days.forEach((d,di)=>{
    for(let m=720;m<=1320;m+=60){const l=document.createElement('div');l.className='hr';
      l.style.top=(dayTop(di)+(m-T0)*ppm())+'px';b.appendChild(l);}
    const st=d.stages[si]; if(!st) return;
    st.sets.forEach(x=>{
      const k=key(di,st.name,x.a,x.s), me=meObj();
      const picked=me&&(me.picks||[]).includes(k);
      const h=Math.max(20,(x.e-x.s)*ppm()-3);
      const el=document.createElement('div');
      el.className='blk'+(picked?' picked':'')+(h<34?' tiny':'');
      el.style.cssText=`top:${dayTop(di)+(x.s-T0)*ppm()}px;height:${h}px;--h:${hue}`;
      el.innerHTML=`<div class="a">${esc(x.a)}</div><div class="t">${x.st}–${x.et}</div>`;
      el.title=x.a+' · '+x.st+'–'+x.et+' · '+st.name+'  (click to preview)';
      el.onclick=()=>playFor(x.a,el);
      const add=document.createElement('button');
      add.className='add'; add.textContent=picked?'✓':'+';
      add.title=me?(picked?'Remove from '+me.name:'Add to '+me.name):'Add a column first';
      add.onclick=ev=>{ev.stopPropagation();
        if(!me){toast('Add a column with your name first');return;}
        act({action:'toggle',id:me.id,setKey:k});};
      el.appendChild(add); b.appendChild(el);
    });
  });
  c.appendChild(b); return c;
}
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function render(){
  // nav jumps to a day
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  OL.days.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='tab'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected',i===DAY); b.textContent=d.day.split(' ')[0];
    b.onclick=()=>{DAY=i; const el=document.getElementById('div-'+i);
      const y0=el.getBoundingClientRect().top+window.scrollY-headH()-DIVH;
      window.scrollTo({top:y0,behavior:'smooth'});};
    tabs.appendChild(b);
  });
  const sel=document.getElementById('me'); sel.innerHTML='';
  if(!STATE.people.length) sel.innerHTML='<option>— add a column —</option>';
  STATE.people.forEach(p=>{const o=document.createElement('option');
    o.value=p.id;o.textContent=p.name;o.selected=p.id===ME;sel.appendChild(o);});
  sel.onchange=()=>{ME=sel.value;localStorage.setItem('ol_me',ME);render();};

  // ---- the one header row, outside the scroller ----
  const hr=document.getElementById('headrow'); hr.innerHTML='';
  const gutH=document.createElement('div'); gutH.className='col gut';
  gutH.innerHTML='<div class="head"></div>'; hr.appendChild(gutH);
  STATE.people.forEach(p=>{
    const c=document.createElement('div'); c.className='col person'+(p.id===ME?' active':'');
    const hd=document.createElement('div'); hd.className='head';
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=p.name;
    nm.title='Double-click to rename';
    nm.ondblclick=()=>{const n=prompt('Rename column',p.name);if(n)act({action:'rename',id:p.id,name:n});};
    const x=document.createElement('button'); x.className='x'; x.textContent='×';
    x.onclick=()=>{if(confirm('Remove '+p.name+"'s column?"))act({action:'remove',id:p.id});};
    hd.append(nm,x); c.appendChild(hd); hr.appendChild(c);
  });
  OL.days[0].stages.forEach((_,i)=>{
    const c=document.createElement('div'); c.className='col';
    c.innerHTML=`<div class="head"><div class="nm" style="color:${HUES[i%HUES.length]}">${esc(STAGE_LABEL(i))}</div></div>`;
    hr.appendChild(c);
  });

  // ---- the grid: all three days, one continuous scroll ----
  const g=document.getElementById('grid'); g.innerHTML='';
  g.appendChild(timeCol());
  STATE.people.forEach(p=>g.appendChild(personCol(p)));
  OL.days[0].stages.forEach((_,i)=>g.appendChild(stageCol(i)));
  g.style.height=totalH()+'px';

  // ---- day divider rows across the full width ----
  OL.days.forEach((d,di)=>{
    const n=d.stages.reduce((a,st)=>a+st.sets.length,0);
    const row=document.createElement('div'); row.className='dayrow'; row.id='div-'+di;
    row.style.top=(di*(dayH()+DIVH))+'px'; row.style.width=g.scrollWidth+'px';
    row.innerHTML=`<div class="lab"><span class="n">${esc(d.day.split(' ')[0])}</span>`+
      `<h2>${esc(d.day)}</h2><span class="cnt">${n} sets · ${esc(d.stages[5].name)}</span></div>`;
    g.appendChild(row);
  });
  syncHead();
}

function headH(){return document.querySelector('header').offsetHeight;}
function syncHead(){
  const w=document.getElementById('wrap');
  document.getElementById('headrow').style.transform='translateX('+(-w.scrollLeft)+'px)';
  document.documentElement.style.setProperty('--hh',headH()+'px');
  document.documentElement.style.setProperty('--divh',DIVH+'px');
}
document.getElementById('wrap').addEventListener('scroll',syncHead,{passive:true});
addEventListener('resize',syncHead);

document.getElementById('addBtn').onclick=()=>{
  const i=document.getElementById('newname'); const n=i.value.trim();
  if(!n){ i.focus(); return; }
  i.value=''; act({action:'addPerson',name:n}).then(()=>{
    const p=STATE.people[STATE.people.length-1];
    if(p){ ME=p.id; localStorage.setItem('ol_me',ME); render(); }
  });
};
document.getElementById('newname').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('addBtn').click();});
document.getElementById('refresh').onclick=pull;

render(); pull();
setInterval(pull, 25000);          // keep friends' columns in sync
</script>
</body>
</html>
