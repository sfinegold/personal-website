<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>7:00 deck — Aug 12</title>
<link rel="icon" type="image/svg+xml" href="/paraform-deck/deck-favicon.svg">
<style>
  :root{
    --ink:#0a0a0a;--ink2:#3a3a3a;--muted:#6f6f6f;--faint:#9b9b9b;
    --bg:#f2f2f1;--card:#fff;--border:#e4e4e4;--bsoft:#efefef;
    --blue:#2f7cf6;--blueink:#1d5fd0;--bluesoft:#eef4fe;--bluebd:#cfe0fc;
    --green:#16a34a;--greensoft:#ecfdf3;--greenbd:#c9ecd4;
    --amber:#b45309;--ambersoft:#fef7e0;--amberbd:#f5e6b8;
    --red:#dc2626;--redsoft:#fdecec;--violet:#7c3aed;--violetsoft:#f3eefe;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;overflow:hidden}
  .serif{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.014em}

  /* chrome */
  .bar{position:fixed;top:0;left:0;right:0;height:46px;z-index:60;background:#0f0f0f;color:#fff;padding:0 14px;display:flex;gap:10px;align-items:center}
  .bar b{font-size:13px;white-space:nowrap}
  .bar .sp{margin-left:auto}
  .tb{background:#1f2228;border:1px solid #34383f;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:#dcdcdc;white-space:nowrap}
  .tb:hover{border-color:#5a5f68}
  .tb.pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .tb.on{background:#fff;border-color:#fff;color:#111}
  .clk{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:#eee;background:#1f2228;border:1px solid #34383f;border-radius:8px;padding:6px 10px}
  .clk.warn{background:#7c2d12;border-color:#9a3412;color:#fed7aa}
  .clk.over{background:#7f1d1d;border-color:#991b1b;color:#fecaca}

  /* stage */
  .stage{position:fixed;top:46px;left:0;right:0;bottom:74px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:right .18s}
  body.dopen .stage{right:400px}
  @media(max-width:900px){body.dopen .stage{right:0}}
  .slide{width:1280px;height:720px;background:#fff;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.13);transform-origin:center center;position:relative;padding:74px 86px;display:none;flex-direction:column}
  .slide.on{display:flex}
  .kick{font-size:15px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:20px}
  .kick .pn{color:var(--faint)}
  [contenteditable]{outline:0}
  [contenteditable]:focus{background:var(--bluesoft);border-radius:6px;box-shadow:0 0 0 3px var(--bluesoft)}
  [contenteditable]:empty:before{content:attr(data-ph);color:#c4c4c4}
  .h{font-family:Georgia,"Times New Roman",serif;font-size:52px;line-height:1.16;letter-spacing:-.018em;font-weight:500;min-height:62px}
  .sub{font-size:23px;color:var(--muted);margin-top:18px;min-height:30px}
  .bl{margin-top:34px;display:flex;flex-direction:column;gap:15px}
  .b{display:flex;gap:15px;align-items:flex-start;font-size:26px;line-height:1.4;color:var(--ink2)}
  .b .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:12px}
  .b .tx{flex:1;min-height:34px}
  .q{font-family:Georgia,serif;font-size:44px;line-height:1.3;color:var(--ink);border-left:6px solid var(--blue);padding-left:30px;min-height:60px}
  .qa{font-size:22px;color:var(--muted);margin-top:24px;padding-left:36px;min-height:28px}
  .foot{position:absolute;left:86px;right:86px;bottom:34px;display:flex;align-items:center;font-size:15px;color:var(--faint);border-top:1px solid var(--bsoft);padding-top:14px}
  .foot .no{margin-left:auto;font-variant-numeric:tabular-nums}

  /* strip */
  .strip{position:fixed;left:0;right:0;bottom:0;height:74px;background:#fff;border-top:1px solid var(--border);display:flex;gap:7px;align-items:center;padding:0 14px;overflow-x:auto;z-index:55}
  .th{flex-shrink:0;width:104px;height:52px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;padding:6px 7px;text-align:left;font-family:inherit;overflow:hidden}
  .th:hover{border-color:#b9b9b9}
  .th.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--bluesoft)}
  .th .tk{font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
  .th .tt{font-size:9.5px;color:var(--ink2);line-height:1.25;margin-top:2px;max-height:26px;overflow:hidden}
  .th.filled .tt{color:var(--ink);font-weight:600}

  /* drawers */
  .dr{position:fixed;top:46px;bottom:0;right:0;width:400px;max-width:92vw;background:#fff;border-left:1px solid var(--border);z-index:58;transform:translateX(100%);transition:transform .18s;display:flex;flex-direction:column}
  .dr.on{transform:none}
  .dr .dh{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
  .dr .dh h3{font-size:13.5px;font-weight:700}
  .dr .dh .x{margin-left:auto;background:none;border:0;font-size:19px;cursor:pointer;color:var(--faint);font-family:inherit;line-height:1}
  .dr .db{flex:1;overflow-y:auto;padding:13px 15px 40px}
  .sbtn{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink2)}
  .sbtn:hover{border-color:#c5c5c5}
  .sbtn.warn{color:var(--red);border-color:#f0cccc}
  .nsec{border-top:1px solid var(--bsoft);padding:10px 0}
  .nsec:first-child{border-top:0;padding-top:0}
  .nsec .nw{font-size:11px;font-weight:800;color:var(--blueink);font-variant-numeric:tabular-nums}
  .nsec .nn{font-size:12px;font-weight:600;color:var(--ink2)}
  .nsec .nt{font-size:12.5px;color:var(--ink2);white-space:pre-wrap;margin-top:3px}
  .none{color:var(--faint);font-size:12.5px}
  .sm{background:#0f1115;color:#e9e9e9;border-radius:10px;padding:11px 13px;margin-bottom:12px;font-size:12.5px;line-height:1.5}
  .sm .hd{font-size:13px;color:#fff;margin-bottom:7px}
  .sm .sl{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#7d818a;margin:9px 0 4px}
  .sm ul{list-style:none}
  .sm li{margin:3px 0;padding-left:11px;position:relative;color:#cfcfcf}
  .sm li:before{content:'';position:absolute;left:2px;top:7px;width:3px;height:3px;border-radius:50%;background:#5a5f68}

  /* practice */
  .pr{border:1px solid var(--border);border-radius:10px;margin-bottom:9px;overflow:hidden}
  .pr .ph{padding:9px 11px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
  .pr .ph:hover{background:#fafafa}
  .pr .ph .pt{font-size:12.5px;font-weight:700;flex:1}
  .pr .cl{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--violetsoft);color:var(--violet);white-space:nowrap}
  .pr .pb{display:none;padding:0 11px 11px;border-top:1px solid var(--bsoft)}
  .pr.open .pb{display:block}
  .pr .say{background:#f6f7f9;border-radius:8px;padding:9px 10px;font-size:12.5px;font-style:italic;color:var(--ink2);margin:9px 0}
  .pr .k{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:9px 0 3px}
  .pr .v{font-size:12.5px;color:var(--ink2)}
  .pr .opt{font-size:12.5px;margin:3px 0;padding-left:12px;position:relative}
  .pr .opt:before{content:'';position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;background:#c9c9c9}
  .pr .opt.pick{color:var(--green);font-weight:600}
  .pr .opt.pick:before{background:var(--green)}
  .pr .trap{background:var(--ambersoft);border:1px solid var(--amberbd);border-radius:8px;padding:8px 10px;font-size:12px;color:#7c4a10;margin-top:9px}

  /* present */
  body.present .bar,body.present .strip,body.present .dr{display:none}
  body.present .stage{top:0;bottom:0;background:#000}
  body.present .slide{border-radius:0;box-shadow:none}
  body.present [contenteditable]:empty{display:none}
  body.present .b:has(.tx:empty){display:none}
  body.present .ptimer{position:fixed;right:16px;bottom:14px;z-index:70;background:rgba(255,255,255,.09);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
  .ptimer{display:none}

  @media print{
    body{overflow:visible;background:#fff}
    .bar,.strip,.dr,.ptimer{display:none!important}
    .stage{position:static;display:block;overflow:visible}
    .slide{display:flex!important;transform:none!important;box-shadow:none;border-radius:0;page-break-after:always;width:1280px;height:720px}
    @page{size:landscape;margin:0}
  }
</style>
</head>
<body>

<div class="bar">
  <b>7:00 deck</b>
  <button class="tb" onclick="go(-1)">←</button>
  <button class="tb" onclick="go(1)">→</button>
  <span style="font-size:12px;color:#9b9b9b" id="pos">1 / 8</span>
  <span class="sp"></span>
  <span class="clk" id="timer" onclick="toggleTimer()" title="Click to start/pause">25:00</span>
  <button class="tb" onclick="resetTimer()">reset</button>
  <button class="tb" id="notesbtn" onclick="drawer('notes')">Notes</button>
  <button class="tb" id="pracbtn" onclick="drawer('prac')">Practice</button>
  <button class="tb" onclick="window.print()">PDF</button>
  <button class="tb pri" onclick="present(true)">Present</button>
</div>

<div class="stage" id="stage"></div>
<div class="ptimer" id="ptimer">25:00</div>
<div class="strip" id="strip"></div>

<div class="dr" id="dr-notes">
  <div class="dh"><h3>From your day page</h3>
    <button class="sbtn" onclick="loadNotes()">Refresh</button>
    <button class="x" onclick="drawer(null)">×</button></div>
  <div class="db" id="notesbody"></div>
</div>

<div class="dr" id="dr-prac">
  <div class="dh"><h3>Practice briefs</h3>
    <button class="sbtn warn" onclick="killPractice()">Remove</button>
    <button class="x" onclick="drawer(null)">×</button></div>
  <div class="db" id="pracbody"></div>
</div>

<script>
/* ---------- slides ---------- */
const SLIDES = [
  {kind:'title', kick:'Work trial · Aug 12',
   h:'The one sentence that holds the whole talk',
   sub:'Sam Finegold · Paraform'},

  {kind:'bullets', kick:'Part 1', k2:'The problem, and who has it',
   h:'State the problem in one sentence',
   sub:'Who it hurts, and how you know it is real',
   b:['Who the primary user is — pick one','What it costs them today','The evidence that it is real','What I am explicitly not solving']},

  {kind:'quote', kick:'Part 2', k2:'What I learned today',
   h:'In their words, not mine',
   q:'The verbatim line that changed my mind',
   qa:'— who said it, and what it made me do differently'},

  {kind:'bullets', kick:'Part 3', k2:'The decision',
   h:'What I picked, and what I killed',
   sub:'Lead with the pick. Then the graveyard.',
   b:['PICK — the direction, in one line','Because — the reason that survives pushback','REJECTED — option two, and why','REJECTED — option three, and why']},

  {kind:'bullets', kick:'Part 4', k2:'Prototype',
   h:'What I built',
   sub:'Demo link — open it, do not describe it',
   b:['The one flow I can show end to end','What is real vs. faked, said plainly','What I would build next in this flow','']},

  {kind:'bullets', kick:'Part 5', k2:'Measurement',
   h:'How I would know it worked',
   sub:'The metric, the read, and what would fool me',
   b:['Primary metric — concrete, not "engagement"','Guardrail metric — what must not get worse','How I would read it — segment, window, n','What would confound the read']},

  {kind:'bullets', kick:'Part 6', k2:'Next, and what I cut',
   h:'What I would do with a week',
   sub:'Cuts are judgment. Name them.',
   b:['Next — the immediate follow-on','Next — the bigger bet behind it','CUT — what I left out, and why','CUT — what I left out, and why']},

  {kind:'title', kick:'Thank you',
   h:'The one thing to remember',
   sub:'Questions'},
];

/* practice briefs get injected here */
const PRACTICE = [{"title": "Submit-time quality gate", "cluster": "quality", "prompt": "Hiring managers keep telling us the top of their pipeline is noisy. Right now nothing sits between a recruiter deciding to send someone and us sending them. Tell me what should happen when a recruiter hits submit.", "really_testing": "Whether the candidate can add friction to the supply side of a supply-constrained marketplace without killing liquidity. Three things underneath: (1) do they find the primitives that already exist — the optional AI calibration verdict, the HM's editable rubric plus intake transcript, Draft for Me's gap flags — instead of proposing new ML; (2) do they notice the recruiter sending the weak candidate is usually obeying a clock (8/week floor, 7-day slot utilisation, 2-in-10 trial), so a gate that only punishes gets routed around rather than obeyed; (3) can they say what the gate costs the scarce side in the same breath as what it buys the abundant one.", "problem": "The first quality check any submission gets is a hiring manager's attention, so the cost of a bad submission is paid by the side of the market that cannot refuse it.", "user": "The unproven recruiter inside a 10-day trial. Not the hiring manager, even though she is the victim. The trial recruiter authors the forced marginal submission and is the only person who can act before the cost lands on someone else. She is also the person a gate can most easily destroy — two qualified submissions in ten days is her survival condition — which is exactly why the gate must cost seconds and not access.", "metric": "The 1-and-2 rate: share of submissions a hiring manager scores 1 or 2 out of 4, computed per role on a recruiter's first ten submissions to that role. Chosen over interview rate because interview rate mixes candidate quality with hiring-manager responsiveness (which the platform already scores separately as HM engagement) and lags by days. Two guardrails reported beside it, not after it: submissions per active slot per week, and trial pass rate — the share of trials reaching two qualified submissions inside ten days. If the 1-and-2 rate falls while trial pass rate falls, I have not improved quality, I have shrunk the funnel.", "evidence": "Ask for the distribution of HM 1-4 ratings split by recruiter state (trial, primary, Preferred) and by hours elapsed since the recruiter got the slot — the trial-hours cut is where the forced-submission hypothesis lives or dies. Then the one question that decides the brief: on submissions rated 1, was AI calibration ever run, and what did it say? If most 1-rated submissions never ran it, the tool is fine and the workflow is broken. If calibration said Good, the model is not fit to gate anything and option 3 is the only survivable design. Add three recruiter calls, one who failed a trial: what did you submit on day nine and why. And ask the question the research could not answer — over what window and sample is the ~60% interview-rate expectation enforced — because a gate is only fair if recruiters can see the clock grading them.", "options": [{"opt": "Hard-block submission on a Bad calibration verdict", "verdict": "REJECT. It enforces an unaudited model against the constrained side of the market, and nobody in the building can state the verdict's false-positive rate today."}, {"opt": "Keep the verdict advisory but make it prettier and more prominent", "verdict": "REJECT. It is already free, unlimited and explicitly penalty-free, and it is still ignored — so the reason is incentive, not placement, and placement is the only thing this changes."}, {"opt": "Force the verdict to run, not to be obeyed: submit is blocked until calibration returns, and a Bad verdict requires a one-line written rebuttal that ships to the HM with the submission", "verdict": "PICK. It costs seconds rather than access, so it survives contact with the trial clock; it creates a record the HM can price; and it makes the recruiter state a reason out loud before sending a weak candidate."}, {"opt": "Route Bad-verdict submissions into a separate long-shot lane in the HM queue", "verdict": "REJECT. It needs HM-side build in the same week I am changing recruiter behaviour, so neither change could be attributed to either result. It is a good second move once the gate has a clean read."}, {"opt": "Charge a single-submission credit for Bad verdicts", "verdict": "REJECT. Credits only exist in the no-slot channel, whose allowance is already performance-elastic; slotted recruiters — who generate most of the volume the HMs are complaining about — would never feel it."}], "demo": "One HTML screen plus one card view, static data, no model call. The submit screen for a single seeded role: pick a candidate, calibration runs inline against that role's must-haves and returns Good, Maybe or Bad with reasons quoted from the rubric. On Bad, the submit button becomes Submit anyway and opens a required one-line rebuttal box. Then flip to the HM's card for that candidate showing the Bad verdict with the rebuttal attached underneath. Seed three candidates: an obvious pass, an obvious fail, and a genuine Maybe where the rubric itself is wrong — so the demo shows the gate does not claim to be right, only to make the decision explicit. All verdicts hard-coded.", "measure": "Read the 1-and-2 rate within role, before and after, never pooled. Five confounds. Role mix: ship during a week of easier roles and the number falls for free, so compare the same roles across the boundary. Substitution — the one that will fool the room: a recruiter who abandons a Bad candidate still has a 7-day slot clock and an 8-per-week floor, so she sends a different mediocre candidate instead, and I book a name swap as a quality win. Guard it by reading abandonment count and submissions-per-slot together; flat volume with high abandonment means substitution, not improvement. Self-selection: genuine abandonment removes a recruiter's worst work from the denominator, which is intended but makes interview rate improve mechanically, so report abandonments as their own line rather than letting them hide in the ratio. Rater drift: HMs who start seeing rebuttals may grade softer or harder, so watch time-to-first-action beside the rate. Volume: a falling 1-and-2 rate with falling submissions per slot is not a win, it is supply contraction wearing a costume.", "cut": "Cut every hiring-manager-side change, all edits to ratings or the allowance formula, and any attempt to validate the calibration model. HM-side work is cut because the gate's value can be read without touching her workflow, and touching both at once destroys attribution. Ratings and allowances are cut because they cannot be rolled back cleanly on Monday. Model validation is cut because it is a two-week data project and the design deliberately does not require the model to be right — only to be seen and answered.", "trap": "Building a hard block and treating the AI verdict as ground truth. It bolts a rejection mechanism onto the scarce side of a supply-constrained marketplace, and the candidate cannot answer the first question in the room: how often is the verdict wrong? The paired trap is applying the gate equally to everyone, taxing proven recruiters for a problem they do not cause. The quiet third trap is assuming the recruiter is choosing freely, when three calendar clocks are telling her to send something today."}, {"title": "The Submitted column", "cluster": "quality", "prompt": "One of our hiring managers posted an announcement asking recruiters to please ease off. She is one of our best customers and a broadcast message is the tool we handed her. Show me what her Monday morning should look like instead.", "really_testing": "Whether the candidate can fix the demand side's experience of a supply-side problem, and whether they know the difference between reducing work and reordering work. It also tests scope honesty: the correct structural fix is wiring the HM's volume preference to the supply-side clocks, and nobody can currently say what that dial changes downstream. A strong candidate names that as the first question for the team, refuses to fake it in a demo, and ships the thing that is real in five hours. It further tests whether they spot that speeding this HM up feeds her HM engagement score, which recruiters shop on — so the fix has a second-order cost.", "problem": "The hiring manager is the marketplace's only quality gate, and we hand her the queue as an undifferentiated stack she has to read one card at a time.", "user": "The hiring manager running two or more open roles, reviewing between meetings. Not a coordinator and not ops. Her 1-4 rating is load-bearing across the whole system — it feeds recruiter ratings, slot retention, streaks, challenge eligibility and enforcement — so the rating has to keep coming from the person whose bar it actually is. Speed up the wrong reviewer and every downstream mechanism is corrupted at once.", "metric": "Median time from submission to the hiring manager's first action on that submission, measured per role, paired with the share of submissions still unactioned at 48 hours. Both already feed the HM engagement score shown to recruiters, so both sides of the market read them and neither is a metric I invented for the demo. Not time-in-queue, which a quiet week improves for free, and not any measure of how long she spends on the board — more looking is not the goal.", "evidence": "Sit with one hiring manager through a real review session, time every card, and note what she reads first: the recruiter note, the resume, or the screening answers. That ordering decides what the grouped card must show. Ask Paraform for submissions per role per week against the volume preference she set, the distribution of time-to-first-action, and how many ratings land in a single burst — heavy batching means review is a deferred chore, not a workflow. Get the exact text of the ease-off announcement and what arrival rate did in the week after it; if arrivals fell, the announcement worked and the product problem is smaller than the brief claims, which is worth knowing before I build anything.", "options": [{"opt": "Auto-reject submissions below a fit threshold", "verdict": "REJECT. It deletes the marketplace's only human quality gate and hides the model's mistakes from the one person positioned to catch them."}, {"opt": "Rank the column by predicted fit", "verdict": "REJECT on its own. Reordering does not reduce the number of cards she opens, and a wrong card at the top is worse than no order at all because it spends her trust on the first click."}, {"opt": "Batch the column into three groups against her own editable rubric — meets every must-have, misses one named must-have, misses two or more — with a one-line reason per card and group-level actions", "verdict": "PICK. She decides on groups instead of cards, every reason is stated in her own criteria rather than a black-box score, and every card stays openable so nothing is hidden from her."}, {"opt": "Cap arrivals by wiring her volume preference to role submission limits", "verdict": "REJECT for this build, and I will say why on stage: nobody can currently tell me what the volume dial changes downstream, or whether the role-level submission limit is a lifetime total or a pending-pool cap. That is question one for the team, not a mechanic I can honestly demo."}, {"opt": "Send a daily digest email instead of the board", "verdict": "REJECT. It relocates the same reading, and it moves the rating away from the board where the rubric and the pipeline context live."}], "demo": "One HTML screen: the Submitted column for a single seeded role with fourteen candidates, and a toggle between today's flat stack and the grouped view. Grouping is computed in the page from that role's must-haves, and each card names its specific miss — two of three must-haves, no fintech. Bulk reject-with-feedback on a group shows the exact note the recruiter would receive. Seed one candidate the rule misfiles so the demo shows the open-any-card escape hatch and the correction path rather than pretending the grouping is right. All data static; no other pipeline stages built.", "measure": "Read median time-to-first-action and the 48-hour unactioned share within the same roles, before and after. Confounds. Arrival volume moves on its own, so a quiet week reads as a win — normalise per card reviewed, not per session. Novelty inflates week one for hiring managers who already batch. Speed can be bought with sloppier ratings, so watch the 1/4 share and mid-round rate beside the timing: a 1/4 spike means she is bulk-rejecting, and because a single 1/4 temporarily disables a recruiter's submissions, a faster HM can knock working recruiters offline as a side effect. Grouping leans on the rubric, so roles with thin rubrics get no lift and drag any pooled average — report by role. And the reflexive one: faster first action raises her HM engagement score, recruiters filter Browse for highly engaged HMs, so the metric can improve while her Monday gets worse. Track arrival rate on her roles as part of the read, not as an afterthought.", "cut": "Cut arrival caps, every supply-side change, AI resume summaries, and mobile. The cap is cut because it is probably the correct fix and I will not demo a marketplace mechanic whose downstream behaviour I cannot describe. Summaries are cut because they add something else to read, and reading volume is the problem. Mobile is cut because the observed behaviour is batch review at a desk between meetings.", "trap": "Building smart ranking, calling it a fix, and being unable to say how many fewer cards the hiring manager opened. The uglier version is auto-reject, which looks decisive in a demo and quietly removes the only human quality signal in the market. The subtle version is assuming the volume preference already binds recruiters — it does not, which is why she was reduced to posting an announcement."}, {"title": "What the HM sees", "cluster": "quality", "prompt": "Hiring managers have started asking us who they are actually getting when a recruiter applies to their role. Today we show them one number, and every new recruiter starts at the top of it. Bring me the fix.", "really_testing": "Whether the candidate will tell the truth to demand without starving supply. This is the platform's hardest tradeoff: recruiters are the constrained side, so any display reading as avoid the new person costs more than the noise it removes. It also tests whether they can show uncertainty instead of averaging it away, and whether they notice that role slots are capped — so an honest display does not merely inform a decision, it reallocates a scarce seat away from someone.", "problem": "A hiring manager cannot tell an unproven recruiter from a proven one, so she prices everyone as average — which taxes the good recruiters and hides the risk of the new ones.", "user": "The hiring manager at the moment she approves or declines a recruiter's application to her role. Not the general rating display anywhere it appears. That approval click is the only place where the missing information changes an action today, and because slots are capped it is also the only place where the information has a price.", "metric": "Sorting quality: the first-round interview-rate gap between the recruiters an HM approved and the recruiters she declined on the same role, with declined recruiters' outcomes read from their work on other roles in the same window. The goal is not more approvals or fewer — it is that her choices track outcomes, and a display carrying real information widens the gap. Approval rate alone is a vanity read: trivial to move in either direction and neither direction is obviously good. Guardrail reported beside it: share of newly approved recruiters who win a first slot within fourteen days.", "evidence": "Run a sorting test with five hiring managers: six anonymised recruiter cards exactly as the product shows them today, ask who they would approve, then reveal those recruiters' real interview rates. If the picks are no better than chance, the current display carries no signal and the brief is confirmed in twenty minutes for the price of five calls. Ask Paraform how many displayed ratings sit at exactly 5.0, approval rate by recruiter tenure, and the spread of outcomes across new recruiters' first ten submissions — that spread is how much variance the single number is hiding. Also ask a boring question with teeth: can the past clients collected at signup be shown to a third party at all, given how strict the platform is about confidentiality? If not, half of the winning card dies and I need to know before I design it.", "options": [{"opt": "Show raw stats for everyone — interview rate, submission count, average score", "verdict": "REJECT. New recruiters have no denominator; zero of two reads as catastrophic, and it starves the side of the market that is already the constraint."}, {"opt": "Hide the rating for new recruiters and show a New badge", "verdict": "REJECT. Honest and useless — it gives the HM nothing to act on, so a risk-averse reviewer declines by default and the badge becomes a rejection button."}, {"opt": "Replace the single number with a confidence-explicit card: a rating band whose width is the sample size, plus what a new recruiter does have — taxonomy match to this role, A/S-tier share of their submissions, and past clients where disclosure is permitted", "verdict": "PICK. Same card structure for everyone, so proven recruiters earn a tight band and new ones show a portfolio instead of a borrowed 5.0 — the uncertainty is displayed rather than resolved."}, {"opt": "Give new recruiters a Paraform-backed guarantee badge", "verdict": "REJECT. Somebody has to eat the fee if the guarantee is called, and that is a commercial commitment I cannot make in a day. It is the strongest next step and it belongs on the last slide with a named owner."}, {"opt": "Show rating history over time per recruiter", "verdict": "REJECT. It adds reading to a click that takes seconds, and a history of a number that started at a default 5.0 mostly plots the default."}], "demo": "One HTML screen: approve recruiters for this role, six recruiter cards, a toggle between today's 5.0 display and the confidence card, and each card expanding to the evidence behind its band. Include real approve and decline buttons so the demo shows a decision changing, not a layout changing. Seed two cards that land the argument in a single glance: a 5.0 built on two submissions sitting next to a 4.6 built on ninety. Static data.", "measure": "Read the approved-versus-declined interview-rate gap with a control arm of roles kept on the old display. Confounds. Censoring: declined recruiters produce no outcomes on that role, so read their outcomes from other roles in the same window, and report separately the count of recruiters declined everywhere — they are invisible to the metric and they are the population the design is most likely to harm. The tenure shortcut is the dangerous one: the gap widens for free if HMs simply start approving tenured recruiters, which looks like sorting and is actually starvation, so the gap and the new-recruiter first-slot rate must be read as one number or I will ship the failure and call it the win. Lag: outcomes take weeks, so week one gives only approval-rate shifts and HM self-report. Second-order: better information may make HMs approve more recruiters per role, raising arrival volume into the same Submitted column another workstream is trying to calm.", "cut": "Cut any change to how the rating is computed, the recruiter-facing view of their own card, and a dispute or appeal flow. The estimator is not the problem; the display of uncertainty is. The recruiter-facing view waits because the first thing worth learning is whether hiring managers decide differently, and telling recruiters first would change their behaviour and contaminate that read.", "trap": "Exposing raw performance stats in the name of transparency. It reads as a warning label on every new recruiter, and the candidate cannot say what it costs the side of the market that is already scarce. The other trap is redefining the problem as make the rating more accurate — a modelling project, not a day — when the rating's accuracy is not what the hiring manager is missing."}, {"title": "Consent nobody checks", "cluster": "quality", "prompt": "A company told us a candidate they contacted had never heard of the recruiter who submitted him. We only find out about this when somebody complains. Do something about it.", "really_testing": "Whether the candidate treats bad-actor behaviour as a detection and evidence problem rather than a policy problem. It also tests whether they notice the third party with no account — the candidate — and whether they see that the 12-month company-scoped ownership lock turns one unconsented submission into a year-long blockage for a real person who was never asked. Finally it tests statistical honesty: the true incidence may be tiny, and a metric that cannot be read at normal volume is not a metric.", "problem": "A recruiter can submit a candidate who never agreed to it, and the 12-month company-scoped ownership lock then blocks anyone else from submitting that person to that company — so the party harmed has no account, no notice, and no way to complain.", "user": "The submitted candidate. They are the only person with first-hand knowledge of whether consent happened, they are currently silent in a two-sided marketplace, and they are the cheapest verification the platform has. Every other detection scheme is inference; this one is testimony.", "metric": "Denials per thousand submissions, per recruiter, as the behaviour signal — with confirmed-consent rate (share of submissions the named candidate confirms within 72 hours) reported beside it as the coverage denominator that says whether the denial number means anything at all. Not reports filed, which counts the reporting channel rather than the behaviour, and the channel is exactly what does not exist today.", "evidence": "Ask for the count of candidate-ownership disputes last quarter and how many were decided on explicit consent — consent is already the arbitration tiebreak, so the cases exist somewhere in ops. Ask what share of submissions have no Parascribe transcript against the attested screen call: that is the population where consent is unverifiable, and it may be most of them. Then do the thing that settles it — call ten recently submitted candidates and ask two questions: did you speak with this recruiter, and did you agree to be submitted to this company. One clear no in ten makes this structural rather than anecdotal, and zero in ten is also an answer worth having before I build.", "options": [{"opt": "Require a Parascribe transcript for every submission", "verdict": "REJECT. Plenty of legitimate screens happen on a phone with no notetaker, so this bans honest work on the constrained side of the market instead of verifying anything."}, {"opt": "Build a recruiter trust score from behavioural signals", "verdict": "REJECT. There are no labels to learn from and no confirmed incident to back-test against, so it punishes patterns rather than catching acts — and it would be indefensible in an appeal."}, {"opt": "Notify the candidate on submission — an email naming the company, the role and the recruiter, with one click for I did not agree to this", "verdict": "PICK. It needs no account, it reaches the only witness, it deters at the moment of authorship, and a denial immediately releases the ownership lock and opens a case."}, {"opt": "Publish a candidate reporting form", "verdict": "REJECT. It requires the candidate to already know Paraform exists and to go looking, which is precisely the thing that is missing."}, {"opt": "Block the submission until the candidate confirms", "verdict": "REJECT. It puts a stranger's inbox on the critical path of a market that runs on 10-day trials and 7-day slot clocks; the notice has to be asynchronous or it becomes a liquidity tax on honest recruiters."}], "demo": "Three static HTML screens. First, the submit moment with the new line telling the recruiter the candidate will be emailed to confirm — the deterrent has to be visible before the act, not after it. Second, the candidate's email exactly as it renders, with the relationship disclosure and the I did not agree link. Third, the trust-ops case view: the denial in the candidate's own words, the released ownership lock, and the recruiter's history. Seed a second case that is a false alarm — a candidate who simply forgot the call — so the flow visibly routes to a human and does not auto-punish anyone.", "measure": "Track denials per thousand submissions and confirmed-consent rate per recruiter. Four confounds. Deliverability dominates everything: a low denial count may mean nobody opened the email, so instrument opens and treat unopened as unknown, never as consent. Deterrence and blindness look identical — if the email works denials fall, and if the email is ignored denials also fall. Resolve it with a holdout of roles that send no email at all, and compare downstream ownership disputes and company complaints across arms. I will not build a silent arm that sends the mail with a dead link, because that arm swallows a real person's real complaint to improve my read. Annoyance denials: some candidates who did consent will click no because the mail surprised them, so every denial routes to a human and none triggers an automatic penalty. Base rates: if true incidence is one in a thousand, no per-recruiter number is readable at normal volume — set a minimum submission count before any recruiter-level rate is displayed or acted on.", "cut": "Cut candidate accounts, any rewrite of the outreach rules or the enforcement ladder, and auto-suspension on a denial. Auto-suspension is cut on purpose: the first denial is often noise, and one wrongly suspended good recruiter costs a supply-constrained marketplace more than a week of slower enforcement.", "trap": "Writing policy. Updating ground rules, adding a report button, restating the confidentiality ladder, and shipping nothing that detects the behaviour. The technical version of the same trap is a recruiter risk score that cannot be back-tested against a single confirmed incident — it feels rigorous and it convicts on pattern."}, {"title": "A better front door", "cluster": "quality", "prompt": "Approvals are a judgment call right now — someone reads a LinkedIn profile and decides. I think we let in people we shouldn't and turn away people we should take. Bring me a better front door.", "really_testing": "Whether the candidate will redesign the decision instead of optimising it. Future submission quality is close to unpredictable from a resume, and ten real submissions say more than any application. The test is whether they convert a binary gate into graduated exposure — and whether they notice that graduated exposure already half-exists, since the platform assigns new recruiters two or three starter roles precisely because they lack a track record. The work is turning that onboarding courtesy into a decision instrument, not inventing a parallel one. It also tests whether they remember supply is the binding constraint before proposing to tighten anything.", "problem": "We make a binary, permanent-feeling bet on a recruiter from a LinkedIn profile, when ten submissions would tell us more than the application ever will.", "user": "The Paraform ops reviewer working the approval queue. They make the call today, they carry the cost of a bad accept, and theirs is the only workflow I can actually change in a day. Designing for the applicant would produce a nicer signup form and no better decisions.", "metric": "Cohort quality at ten submissions: the share of an intake cohort's first ten submissions rated 3 or 4 by hiring managers, reported beside the share of that cohort who reach ten submissions at all. It is the earliest honest read on whether the front door selected well, it rides a signal that already exists, and the reviewer cannot move it directly. Approval rate and time-to-decision are both easy to move and neither tells you whether the bet was good.", "evidence": "Take forty already-approved recruiters, split them by intake route — auto-approved, manually reviewed, HM-invited — and compare the ratings on their first ten submissions. If the routes do not separate, the application predicts nothing and reviewer judgment is theatre; that single chart decides the whole day. Ask for the application fields, the route, and each recruiter's first-ten rating spread. Ask what share of applicants get pushed to Connectors and whether any ever convert, since that is the current answer for everyone we are unsure about. And ask how the two or three starter roles given to new recruiters are chosen — for the recruiter, or for the role — because that is already a provisional-exposure mechanism and I would rather extend it than build a second one beside it.", "options": [{"opt": "Score applications with a model", "verdict": "REJECT. The labels barely exist, and no scorer helps if the input carries no signal — the forty-recruiter chart has to come before anyone writes a feature list."}, {"opt": "Raise the bar and reject more", "verdict": "REJECT. Supply is the binding constraint, so tightening an unvalidated gate destroys known volume for an unmeasured gain."}, {"opt": "Provisional access with a bounded blast radius: approve broadly, cap a provisional recruiter's concurrent roles and submissions, route them through the starter-role pool the platform already assigns, and show the reviewer the applicant's top three live candidates matched against open roles", "verdict": "PICK. It moves the decision from a resume to real submissions, contains the downside inside a pool that already exists for this purpose, and uses candidate data signup already collects and then largely wastes."}, {"opt": "Send everyone uncertain to Connectors first", "verdict": "REJECT. Connectors is referral with no role visibility, no screening and no outreach, so it tests a different job than the one we are hiring for and its signal will not transfer."}, {"opt": "Require references from past clients", "verdict": "REJECT. Slow, unfalsifiable, and it selects for agency backgrounds — the pool that already gets auto-approved, so it buys nothing at the margin where the decision is hard."}], "demo": "One HTML reviewer queue with eight seeded applications, plus one follow-on screen. Each queue row shows the structured application beside a match panel: the applicant's top three candidates scored against three live roles, with talent tiers and must-have hits. Actions are Approve, Provisional — showing the submission cap and the starter-role set — or Reject with reason. The second screen shows the provisional cohort at day 30 with a graduate-or-revoke recommendation computed from first-ten ratings. Seed the two applicants that carry the argument: a polished agency recruiter whose candidates match nothing live, and a no-experience applicant whose three candidates are S-tier for two open roles. All data static.", "measure": "Compare cohort quality at ten submissions across intake weeks, old rule against new. Five confounds. Role mix: a cohort entering during a week of easy roles looks better for free. Reviewer learning: the same reviewers improve over a month regardless of tooling, so run at least one week with the match panel hidden. Survivorship: recruiters who churn before ten submissions leave the numerator entirely, and churn is itself an outcome, so report reached-ten rate beside quality. The worst one is that the starter-role pool is not a random sample of roles — if those roles are easier or their hiring managers rate more forgivingly, the provisional cohort's ratings are inflated by the very mechanism under test. Compare provisional recruiters against established recruiters on the same starter roles in the same weeks, never against the platform average. Last, the match panel favours applicants who happen to hold live candidate inventory this month, which is timing and market luck, not screening skill.", "cut": "Cut changes to the signup form, an appeals flow, any scoring model, and anything touching Connectors. The signup form stays as it is because the reviewer's information problem is solvable with data already collected. Appeals stay cut because provisional access removes most of the reason to appeal — almost nobody is turned away, they are let in small.", "trap": "Building a tidy application rubric. It produces a prettier, slower queue and never asks the only question that matters: does the application predict anything at all? The companion trap is recommending a higher bar in a marketplace whose scarcest asset is good recruiters, with no estimate of the recruiters that bar would have cost. The third is presenting provisional access as a new invention and getting caught by the fact that starter roles already do a version of it — badly, and for a different reason."}, {"title": "New role cold start", "cluster": "liquidity", "prompt": "A role goes live and what happens next is luck. Some launches go well, some quietly don't, and the client has formed a view of us before we notice. Own the launch.", "really_testing": "Whether the candidate finds the actual scarce asset in the first 48 hours — a recruiter who already holds the right person — instead of shipping a faster notification and calling speed a win. Second, whether they pick a metric that speed alone cannot win, on a platform whose own chrome sells speed on every surface.", "problem": "Nobody owns a role's first 48 hours. Slots go to whoever applies and gets approved first, each of those recruiters then starts a private 10-day trial that pays them to submit before the intake recording can even be watched, and the HM's first impression of Paraform gets set by a candidate that was rushed to beat a clock.", "user": "The recruiter who already has a screened, consented candidate for this role sitting in their CRM. Over the HM: the HM absorbs the damage but has no lever except leaving. Over the full qualified pool: an existing warm candidate is the only asset that makes fast and good compatible inside 48 hours — everyone else has to source, and sourcing under a trial clock is precisely where the thin submissions come from.", "metric": "Hours from role going live to the first submission the HM rates 3 or 4 — steered as the share of launches that get one inside 48 hours, not as a mean, because the failure lives in the tail. Quality-adjusted on purpose: plain time-to-first-submission is already easy to win, and the mechanisms that win it are the same ones producing the shallow candidates HMs complain about. Not slots filled, which measures how fast a lottery runs. Not week-one submission count, which the 7-day utilization clock delivers whether or not the launch was any good.", "evidence": "Pull hours-to-first-3-or-4 for every role posted last quarter and read the tail, not the median. Diff the fast tail against the slow tail on role family, fee %, salary band, must-have count, and the density label the role carried at launch. Then ask ops for the last twenty roles that launched hot and the last twenty that stalled, and ask one question about each: what did the first approved recruiter already have in hand? Then sit with five recruiters who submitted within a day and ask how they found the role and whether the candidate predated it. If warm candidates do not separate the two tails, the premise is wrong and I want to know that before lunch, not after building.", "options": [{"opt": "Notify every qualified recruiter within an hour of launch.", "verdict": "REJECT — buys speed with no fit. It hands the slot cap to whoever clicks fastest, and each of them then starts a 10-day trial that pays them to submit before calibration is possible."}, {"opt": "Boost new roles to the top of Browse for 48 hours.", "verdict": "REJECT — pull-only. The recruiter holding the right candidate today has no reason to open Browse today, and Browse ranking cannot be aimed at one role's specific need."}, {"opt": "Invite-first launch: rank recruiters by warm-candidate match against the new role, send a small number of pre-approved slot invites, open remaining slots to Browse at hour 24.", "verdict": "PICK — it aims at the one asset that makes a fast submission also a good one, and it shortens the open race rather than abolishing it. Mostly wiring: talent-network matching already runs in the background, it just runs demand-pull today, triggered by HM interest rather than by a launch."}, {"opt": "Pay a launch bonus for the first submission inside 24 hours.", "verdict": "REJECT — pays for the one thing the platform already over-supplies, and pays before any quality signal exists. Streaks and Challenges both gate their money on interview rate; this would be the only reward with no quality gate at all."}, {"opt": "Pause the 10-day trial clock until the role's slots are full.", "verdict": "REJECT — a real fix, but for the recruiter's problem, not the HM's. The HM waiting on a first candidate gets nothing, and it slows every launch to protect late joiners. What the clock already does when a role saturates mid-trial is undocumented, so I would ask before assuming this is even a change."}], "demo": "A Launch Board for one seeded role. Left: eight ranked recruiters, each row showing the specific CRM candidate that matched, their interview rate in that role family with the sample size printed beside it, and one button — Invite with pre-approved slot. Right: a 48-hour clock, a slot tracker that fills as invites are accepted, and a target chip that flips when the first 3-or-4 rating lands. Three clicks walk the entire launch. One HTML page, seeded JSON, state in JS, no backend. Most of the five hours goes into the seed data and the one-line ranking rationale under each recruiter, because that line is what gets argued about, not the layout.", "measure": "Share of launches with a 3-or-4 rated submission inside 48 hours, invite-launched versus not, over roughly six weeks. Three things corrupt the read. Selection: ops will send invites on the well-specified roles at good comp, so the launched cohort looks better because it was easier — randomize which new roles get an invite launch, or at minimum block on role family, fee %, and salary band. Cannibalization: pulling strong recruiters onto new roles takes them off older ones, so watch submission flow on roles older than 30 days in the same weeks and score a lift that came from moving supply as no lift. And the metric has an HM inside it: if HMs simply rate faster during a pilot because ops is talking to them more, the number moves with nothing having changed about what was sent — track HM time-to-first-rating separately and read the two together.", "cut": "Cut everything after hour 48 — different problem, different owner. Cut the HM side entirely; a good launch should ask nothing new of them. Cut the matching model itself, which uses whatever the existing talent-network match already produces; I am not retraining anything in a day. Cut the case where no recruiter has a warm match, which is a different brief. Cut deciding how many slots to hold back, because the per-role slot cap is not a number I have — it is my first question for whoever owns roles.", "trap": "Building a notification. It reads as the obvious fix, it demos in an hour, and it will move time-to-first-submission — by filling the slot cap with the fastest clickers, who then submit inside 48 hours to beat their own trial clocks. The candidate ships the exact mechanism that produces the complaint they were hired to fix, and then cannot explain why the first submission got worse while the number got better."}, {"title": "Roles that go dark", "cluster": "liquidity", "prompt": "Roles go quiet on us. Weeks later the company churns and we find out at the same time they do. I want to know what we actually do about it, not that it's happening.", "really_testing": "Whether the candidate commits to an intervention that costs a specific named person something — taking a slot back, or telling an HM they have stopped doing their part — instead of building a dashboard. And whether they notice a quiet role can be quiet on either side, and that the two sides need opposite treatments.", "problem": "Roles die without an event. Slots stay held, the 7-day utilization rule is satisfied by one thin submission or a stale pipeline entry, and nothing in the system distinguishes a role with no flow coming in from a role whose HM stopped reading. By the time anyone looks, the HM has disengaged and the recovery window has closed.", "user": "The Paraform ops person who can reclaim a slot and call an HM. Over the HM: their only lever is to leave, and asking them to act is asking the disengaged party to do the work. Over the slotted recruiter: they are meeting their obligations exactly as written, and the utilization rule is telling them they are fine — they do not experience this role as dying.", "metric": "Recovery rate at 14 days: of the roles flagged in a given week, the share that receive a submission rated 3 or 4 within the next two weeks. Not count of stalled roles, which falls if Paraform simply takes on fewer hard roles. Not submissions into stalled roles, which the volume floors will deliver without any recovery and which actively worsen the half of these that are dying on the demand side. Beside it I would carry one counter-metric — company churn at 60 days — because a recovery that does not keep the client is a vanity number.", "evidence": "One table, every open role, two columns: days since last submission, days since the HM last rated or advanced anyone. The gap between those columns is the whole finding — if dark roles split cleanly into no-flow-in and no-action-out, the two-cause model is real. Then pull the last twenty churned companies and see what those two columns looked like 30 days before they left. Then call five HMs whose roles are dark today and ask exactly one question: are you still hiring for this? Some share will say no, and that share sets the ceiling on any recovery number I could ever promise.", "options": [{"opt": "Ship ops a dashboard of stalled roles.", "verdict": "REJECT — ops can already name the dying roles, so a list adds nothing. The missing artifacts are the recommended action and the authority to take it."}, {"opt": "Auto-reclaim slots after 14 dark days and reopen them to the waitlist.", "verdict": "REJECT — it re-runs the same lottery on a role the market has already declined, and it punishes recruiters on roles that are dark because the HM went silent, which is the one case where they did nothing wrong."}, {"opt": "Triage that separates supply stall (slots held, no flow in) from demand stall (flow arriving, HM stopped rating) and routes each: reclaim and re-invite for supply, HM escalation for demand.", "verdict": "PICK — the two are indistinguishable on any activity view and need opposite treatments, and pushing candidates into a demand stall accelerates the churn it was meant to prevent. It is also cheap: the split is two timestamps, not a model."}, {"opt": "Ask HMs to mark roles paused.", "verdict": "REJECT — it asks the least engaged party for the input, and the only ones who answer are the ones already engaged. Recruiters are shown an HM engagement score, so some of this signal exists already — though whether it is scored per HM or per role is not something I know, and that answer decides how much of this triage is free."}, {"opt": "Email slotted recruiters that the role is stalling.", "verdict": "REJECT — the 7-day clock already pushes them, so a nudge on top buys one more least-bad candidate. On a demand-stalled role that is the poison, and the recruiter eats the rating risk for a problem that is not theirs."}], "demo": "A Role Vitals triage queue with eight seeded roles. Each row: two sparkbars — submissions in, HM actions out — a cause label the page assigns from those two series (Supply stall / Demand stall / Healthy), and one action button. Reclaim opens a drawer naming which slot, how long it has sat unfed, and what the recruiter will be told. Escalate drafts the HM message. Worked rows move to a Watching tab with a 14-day timer. One page, one table, one drawer, seeded JSON. The five hours go into the cause rule and three deliberate edge cases in the seed: a role with flow and no ratings, a role with ratings and no flow, and one that is genuinely just slow.", "measure": "14-day recovery on flagged roles against matched unflagged roles. Three confounds. Ops works the easy roles first and easy roles recover on their own, so hold back a random half of each week's flagged queue for two weeks, or match on role age, fee %, band, and HM engagement score. Darkness is partly calendar — holidays, an HM on leave, a funding event — so read the flagged cohort against the same calendar weeks a quarter earlier before believing any lift. And the one that will actually break the number: some share of dark roles are dead for reasons the marketplace cannot touch, because the req was cancelled or filled internally. That share is a property of intake mix, not of the intervention, so a quarter where sales sold more speculative roles drops recovery rate with nothing having changed. Report recovery on roles the HM confirms are still open, and report the confirmation rate right next to it.", "cut": "Cut any change to the 7-day utilization rule itself — it is load-bearing across the whole marketplace and not a one-day decision. Cut the recruiter-facing surface; they receive an outcome, not a new screen. Cut prediction: no model guessing which roles will stall, because a same-day flag on observable silence catches most of it. Cut the question of whether Paraform should have taken the role at all, which belongs to a different brief.", "trap": "Reading every dark role as a lazy recruiter and shipping a nudge. Roughly half are dark because the HM stopped rating, and a nudge pushes more candidates into a pipeline nobody is reading — which burns the recruiters' interview rates and churns the company you were trying to save, in that order."}, {"title": "Blind role picks on Browse", "cluster": "liquidity", "prompt": "Recruiters keep committing to roles they were never going to win, then blame us when it goes badly. They're making that call off a Browse card. Fix the call.", "really_testing": "Whether the candidate will publish a number that hurts short-term slot fill — real competition — to buy better matches, and can defend that trade to a marketplace whose reflex is to fill every slot. Also whether they notice the card already carries some competition signal, so the actual gap is narrower and far more specific than 'add transparency'.", "problem": "A recruiter commits to a 10-day, two-submission trial without knowing how many others are on the role. Browse gives them a coarse red High recruiter density label, an interviewing count, and an openings count — but the numbers that decide whether the trial is winnable, slots left and submissions already absorbed, stay hidden. A wrong pick costs a Standard recruiter a third of their pending-application inventory plus ten days of calendar, and costs the HM two rushed candidates.", "user": "The Standard recruiter capped at three pending applications. Over Preferred: Preferred has unlimited approvals, so a bad pick is nearly free for them. For a Standard recruiter it is a third of their inventory and ten days, and it is their interview rate that takes the damage when they submit something weak to clear the trial.", "metric": "Qualified trial completion: the share of started trials that produce two qualified submissions AND at least one first-round interview. Stricter than the platform's own trial bar on purpose — the platform's bar is two submissions, which a recruiter can clear by submitting anyone, so trials passed is not evidence the pick was good. Not applications started, which rises whenever applying gets easier. Not slot fill rate, which is the number this change is explicitly allowed to lower.", "evidence": "Split trial outcomes by the density label the role carried at the moment of application. If failures pile onto High density, competition is the story; if they spread evenly, fit is, and this is the wrong brief. That requires the label to be logged historically, which I do not know is true — question one. Then watch five Standard recruiters pick a role out loud on Browse and write down every question the card cannot answer. Then check what share of failed trials happened on roles that had already hit their submission limit; that limit exists and is undisclosed, so I need it from whoever owns roles before I can size this at all.", "options": [{"opt": "Put slots remaining and submissions received in the last seven days on every role card.", "verdict": "PICK — these are the two inputs to the join-or-not decision that is currently made blind, and the card already commits to showing market state (fee, band, density, interviewing count), so this is a resolution increase on an existing promise rather than a new one."}, {"opt": "Keep density coarse, add a personalized fit score badge.", "verdict": "REJECT — an unauditable score gets ignored, and fit is not the unknown. A recruiter knows whether they can source the role; they cannot see who else already is."}, {"opt": "Refund the pending-application slot when a trial fails on a saturated role.", "verdict": "REJECT — pays for the mistake instead of preventing it, and makes piling onto hot roles cheaper, which is the behavior generating the failures."}, {"opt": "Cap or block applications to high-density roles automatically.", "verdict": "REJECT — the platform makes the call and hides the reason, which is the same blindness with the decision moved to someone the recruiter cannot argue with."}, {"opt": "Extend the 10-day trial on dense roles.", "verdict": "REJECT — the pick is still blind, just blind for longer, and it slows the roles that are working to protect the ones that are not. It may also not be a change at all: what the clock does when a role saturates mid-trial is undocumented, and I would find out before touching it."}], "demo": "A rebuilt Browse: ten seeded cards now carrying slots left, submissions in the last seven days, and the HM's existing engagement signal, sortable by slots left. Apply opens a confirm sheet that does the arithmetic out loud — '2 slots left, 4 recruiters already on, 9 submissions this week, 1 opening. You need 2 qualified submissions in 10 days.' A toggle flips between old card and new so the room can argue about the same role twice. One page, one modal, static JSON. Most of the five hours goes into seeding roles that make the trade-off visible: one dense role that is still clearly winnable and one thin role that clearly is not.", "measure": "Qualified trial completion on accounts with the new card versus the old, randomized by account rather than by opt-in — the recruiters who choose the new view are the careful ones who would have passed anyway. Two confounds, and the second decides the experiment design. Redistribution: publishing slot counts herds everyone onto low-density roles, so completion climbs while total trials fall and hard roles lose the little coverage they had — read completion next to trials started and next to coverage on High-density and zero-application roles, and score a completion win with falling coverage as a loss. Interference: treated and control recruiters compete for the same finite slots, so every treated recruiter who skips a dense role hands that slot to a control recruiter and pushes the control number down. An account-level A/B therefore overstates the effect, possibly badly. If volume allows, randomize by role family or by week and accept the noisier read.", "cut": "Cut the trial rules, the density algorithm, and the three-application cap — all real levers, none of them a day's work. Cut the HM side. Cut showing which recruiters are on the role, which invites poaching and gaming. Cut the fit score entirely, and say out loud why: it answers a question nobody asked.", "trap": "Adding a personalized match score and calling it done. It demos beautifully, it is the first thing every marketplace PM reaches for, and it answers the one question the recruiter can already answer for themselves."}, {"title": "Roles nobody will take", "cluster": "liquidity", "prompt": "We've got roles that have been up for weeks with nothing real on them. We keep telling the client it'll pick up. I want a real answer for those roles by tonight.", "really_testing": "Whether the candidate treats recruiter silence as information about the role rather than as a distribution failure — and whether they will build the thing that makes Paraform say something unwelcome to a paying client.", "problem": "A share of roles never attract a recruiter who can actually work them. They sit in Browse, the client's experience decays quietly, and there is no moment where anyone converts the market's verdict into a sentence the client can act on. Paraform absorbs as a supply problem what is usually a spec or comp problem.", "user": "Whoever at Paraform owns the client relationship — the person who ran the intake call and gets blamed when the role dies. Over the recruiter: they already decided and moved on. Over the HM: only the relationship owner can reopen the terms of the role, and only they can deliver the message in a form the client will actually hear.", "metric": "Working coverage at 30 days: the share of diagnosed roles where at least one recruiter with prior submissions in that role family clears the trial bar — two qualified submissions — within 30 days of the diagnosis going out. Not slots filled, because a slot can be held by someone who never produces and the utilization rule lets that persist. Not roles filled, which is the honest outcome but far too slow and noisy to steer a weekly loop on. Not applications received, which rewards spray, and spray is already the failure mode on these roles.", "evidence": "Take every role with zero applications after seven days and diff it against roles that took slots within 48 hours: fee %, salary band against market for that title and location, remote policy, and count of must-haves. One of those columns should separate them cleanly; if none does, the problem is not the spec and this brief dies today. Then put three uncovered roles in front of five recruiters and ask why they passed — the answer is one sentence and they give it immediately. Then find out whether fee % can even be changed on a live role and by whom, because a whole branch of fixes is worthless if it cannot.", "options": [{"opt": "Auto-raise the fee percentage on uncovered roles.", "verdict": "REJECT — it is the client's money, and I do not know that fee % is changeable in-product on a live role. It also assumes every silence is a price problem, which is exactly what the evidence step is there to test."}, {"opt": "Broadcast uncovered roles to all recruiters weekly.", "verdict": "REJECT — the recruiters who could take it have already seen it in Browse and passed. Impressions do not move a comp band."}, {"opt": "Capture a one-tap pass reason on Browse, aggregate it, and hand the relationship owner a client-ready role diagnosis with a specific fix.", "verdict": "PICK — it converts silence into a negotiable fact, and it is the only option that can change the role rather than the audience. It is also the smallest thing that produces the sentence the client needs to hear."}, {"opt": "Route uncovered roles to Connectors.", "verdict": "REJECT — Connectors get no role visibility and do no screening. A hard role needs the most calibration and this channel supplies the least."}, {"opt": "Guarantee a slot plus a retainer to a specialist recruiter.", "verdict": "REJECT — it changes the payment model, which needs finance and legal, and it spends cash to bury an intake problem that will recur on this client's next role."}], "demo": "Two screens. On Browse, a Pass control on each card opens a five-chip picker: comp below market, location, must-haves unrealistic, no network here, fee too low for the work. On the relationship owner's view, one uncovered role shows those reasons stacked by count and weighted by whether that recruiter has submitted in the family before, plus one generated paragraph a human could paste into an email — 'Seven of nine recruiters passed on comp. The band sits below three comparable roles that took slots within 48 hours.' Chips, one aggregation bar, one templated paragraph, seeded JSON. The five hours go into the chip list and the weighting rule, because those two decide whether the paragraph is true.", "measure": "Working coverage at 30 days on roles where the client accepted a change, compared against that same client's other open roles — never against the platform average, because clients who take advice are the engaged ones whose roles would have improved anyway. Two more confounds. Pass reasons are self-serving: a recruiter with no network in the family will still say comp, because it is the socially free answer, so weight reasons by whether that recruiter has ever submitted in the family and sanity-check every comp claim against the actual band before repeating it to a client. And the sample is wrong by construction — only recruiters who opened the role can pass on it, so the diagnosis is built from the most interested slice of the market and says nothing about the far larger group who scrolled past. Track role open-rate beside the pass reasons: a role nobody opened has a different disease from a role nine people opened and declined.", "cut": "Cut fee percentage and payment terms. Cut the intake call and its rubric, where the durable fix lives — name it as what comes next. Cut Connectors. Cut auto-rejecting bad roles at intake, which is the right endgame and far too big for a day. Cut solving the recruiter's incentive to give a pass reason at all, and flag it as the biggest open risk in the plan: nothing in this design pays them for that click.", "trap": "Reading this as distribution and building alerts, digests, or better Browse ranking. The roles were seen and declined. Every hour spent on reach is an hour not spent on the one sentence the client has to hear — and reach is the part that demos well."}, {"title": "Recruiter fit beyond signup", "cluster": "liquidity", "prompt": "We push roles at recruiters and they mostly ignore them, and when they do bite it often goes nowhere. Make the roles find the right people.", "really_testing": "Whether the candidate builds the profile from outcomes the platform already owns instead of collecting more self-report — and whether they will let the profile say no out loud, and deliberately hold back matches to keep it honest.", "problem": "Role targeting leans on a taxonomy the recruiter picked at signup, capped at three roles, three locations, three stages, three industries — and a recruiter names the work they want, not the work they win. The platform holds better evidence, because it can see where a recruiter's submissions actually reach interviews. Whether any of that outcome data already feeds targeting is not something I can see from outside, and it is the first thing I would verify.", "user": "The mid-tenure Standard recruiter with enough history to compute on — the platform already uses a last-50-submissions window for allowances, so 50 is a defensible floor. Over new recruiters: no history to compute from, and they get platform-assigned starter roles anyway. Over Preferred: they already have unlimited approvals and early role access, so better push matching is worth least to the people who need it least. The middle is where good supply gets spent on the wrong roles.", "metric": "Within-recruiter interview rate: for the same recruiter, interview rate on submissions that came from a platform-initiated match against interview rate on submissions they found themselves. Within-recruiter on purpose, because a between-recruiter comparison just rediscovers that good recruiters are good. Not invite acceptance rate, which is won by sending easier invitations. Not match volume, which is won by sending more. Not recruiter rating, a composite that moves far too slowly to steer a six-week loop.", "evidence": "For thirty recruiters with 50-plus submissions, compute interview rate by role family and lay it beside the taxonomy they chose at signup. The size of that gap is the entire premise — if the taxonomy already predicts where they win, there is no product here. Then confirm what actually drives role targeting today, because outcome data may already feed it in a way I cannot observe. Then show five recruiters their own computed profile and ask one question: is this you? Their corrections reveal what the outcome data is blind to — a family they just moved into, a client they cannot work.", "options": [{"opt": "Let recruiters edit their taxonomy and prompt them to refresh it quarterly.", "verdict": "REJECT — the same self-report, later. It may also already be possible; whether the signup taxonomy is editable is not something I know, which would make this a no-op dressed as a project."}, {"opt": "Build an edge profile from outcomes — the families, stages, and locations where a recruiter's interview rate beats their own average — and use it to rank Browse and pick invite lists.", "verdict": "PICK — it uses evidence the platform already collects, the recruiter can audit it against their own experience, and it can be visibly wrong, which is what makes it fixable."}, {"opt": "Rank by recruiter rating alone.", "verdict": "REJECT — rating says who is good, not who is good at this. It also concentrates matches on Preferred and starves exactly the middle this brief is about."}, {"opt": "Match purely on candidate-network overlap, the way the existing background matching does.", "verdict": "REJECT — that answers who has someone right now, which is the launch question. It does not answer who should hold a slot on this role for the next six weeks."}, {"opt": "Give HMs a longer ranked recruiter list to choose from.", "verdict": "REJECT — HMs currently see a compressed 5-point rating that new recruiters enter at the top of. More rows without a better instrument relocates the guess, and quietly turns a matching change into a trust change with a different review."}], "demo": "A recruiter-facing Your Edge page computed in the browser from about sixty seeded submissions. Three strength cards — role family, stage, location — each showing interview rate against that recruiter's own average with the sample size printed next to it, never hidden. Below them, the part that will get argued about: an explicit 'we are not routing you these' list of the families where they underperform. Then a Browse feed re-ranked by the profile with a one-line reason on each card, and a toggle back to the signup-taxonomy ranking. One page, seeded JSON, all arithmetic in JS. Most of the five hours goes into the seed: it needs one recruiter whose signup taxonomy is right and one whose is badly wrong, or the demo proves nothing.", "measure": "Within-recruiter interview rate, matched submissions versus self-found, over about six weeks. Four things corrupt it. Small samples manufacture edges — eight submissions in a family will look like a specialty — so gate the profile on a minimum count and print that count everywhere the profile appears. Self-fulfilling routing: once the profile only sends fintech roles, the non-fintech sample stops growing and the edge looks permanent, so hold back a fixed slice of exploratory matches and keep measuring them even though they will look like waste on the dashboard. Family difficulty differs — some families interview far more freely — so compare against the family's platform-wide interview rate, never the raw number. And the sharpest one: matched roles and self-found roles are not the same roles. Matched roles skew newer and less crowded, and crowding moves interview rate through HM attention alone, so hold role age and density constant or the profile takes credit for having picked fresh roles.", "cut": "Cut the signup taxonomy UI, which stays exactly as it is. Cut any HM-facing recruiter ranking — that is a trust change with a different review. Cut retraining any model; this is an aggregation over submissions the platform already stores. Cut writing the profile into slot approvals, single-submission allowances, or the waitlist, which is where this goes next and where being wrong starts costing recruiters money.", "trap": "Adding a preferences page. It looks like personalization, it ships in a week, and it changes nothing — because the premise of the brief is that what a recruiter says about themselves is the least reliable input the platform holds, and a preferences page collects more of exactly that."}, {"title": "Paraform works a role itself", "cluster": "ai", "prompt": "Some roles sit on Browse for weeks and all we tell the company is to be patient. We keep saying we want to be an agentic recruiting firm. Show me Paraform working a role itself.", "really_testing": "Whether you scope the agent to the roles where it adds supply instead of taking a seat from the recruiters you are short of, and whether you notice that Paraform's own submission preconditions block an agent outright: a submission needs an attested completed screen call plus confirmed consent and interest, and whoever submits locks 12-month company-scoped ownership of that candidate. Also whether you say out loud who eats the 1/4.", "problem": "When no recruiter works a role, Paraform cannot produce a candidate itself, so the company waits, the fee never lands, and the only thing we ship is patience.", "user": "The hiring manager on a low-density role with an empty Submitted column at day 7. Not the recruiter: roles nobody is working are the only place agent supply adds candidates instead of taking a slot from a human who would have filled it, and they are the only place the 12-month ownership lock costs no one.", "metric": "Share of roles with zero submissions at day 7 that reach a 3-or-4 rated submission within the next seven days. Two guardrails: the house account's own 1/4 rate, held to the same bar that temporarily disables a human recruiter's submissions; and the count of agent-owned candidates that a human recruiter is then locked out of for 12 months at that company.", "evidence": "Ask ops for days-to-first-submission across open roles, split by the density label shown at post time, and for the list of roles that closed with no hire last quarter plus what we told those companies. Test whether the coarse High/Low density label actually predicts a submission drought, since exact slot counts are hidden even from recruiters. Two numbers the research could not get and this depends on: the recruiter-slot cap per role and the role-level submission limit, because they decide whether agent submissions crowd out humans.", "options": [{"opt": "Agent sources and submits under a Paraform house account, only on roles at zero submissions on day 7, with an ops recruiter attesting the screen call and consent before the submit button unlocks, rated 1-4 like anyone else", "verdict": "PICK — it is the only version that meets the submission preconditions with a real person's signature, and it puts Paraform's own name on the same rating scale as its recruiters."}, {"opt": "Agent auto-submits with no human attestation", "verdict": "REJECT — it either lies on the consent and screen-call fields or forces us to rewrite the contract every recruit
