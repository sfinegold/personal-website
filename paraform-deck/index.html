er is graded against, for the least valuable roles on the platform."}, {"opt": "Agent builds a sourced list and hands it to a human recruiter", "verdict": "REJECT — recruiters are the constraint, so a list nobody works is a second dead role; and the handoff still needs someone to take 12-month ownership."}, {"opt": "Agent runs outreach as the company", "verdict": "REJECT — outreach rules forbid claiming to work at the client, and one bad thread costs the account."}, {"opt": "Open these roles to Connectors at a higher bounty", "verdict": "REJECT — Connectors do not screen by design, so it moves the burden onto the HM we are trying to protect."}], "demo": "Two static screens, hand-written data. Screen one: a role page at zero submissions with a \"Have Paraform work this role\" button that returns three candidates, each with one evidence line per must-have quoted from a named source. Screen two: the submit path, where every candidate is blocked behind a checklist only an ops person can sign — screen call completed, consent confirmed, interest confirmed — and one cleared candidate lands in the HM's Submitted column as \"Paraform (house)\" on the ordinary 1-4 card. The blocked state is the point of the demo, not the sourcing.", "measure": "Compare zero-submission roles where the agent ran against a held-back matched set. Confounds: these roles are cold for a cause — comp, location, unrealistic bar — so the agent's 3/4 rate looks bad even when the agent is good, which means matching on fee percentage, salary band and seniority, not on the density label alone. A visible \"Paraform is working this\" state can pull human recruiters onto the role out of fear, so the lift you read may be theirs. And roles still at zero on day 7 are the extreme tail, so they drift toward more submissions on their own; a single-arm before-and-after reads as a win with no treatment at all.", "cut": "Reply handling, scheduling, everything after the first HM rating, and multi-role. The claim under test is that the agent can produce one rateable candidate on a role nobody wants and get it through our own gates, not that it can run a search.", "trap": "Building a general AI sourcer that competes with your own recruiters on hot roles, and never answering the two questions that decide whether it can ship at all: who attests the screen call and consent, and who eats the 1/4."}, {"title": "Pre-screen before the call", "cluster": "ai", "prompt": "Parascribe records every screen call and Draft for Me writes the submission from the transcript. The obvious next step is the agent doing the screen. Take a swing at it and tell me what you would actually ship.", "really_testing": "Whether you split the screen call into verification, which a machine can do, and consent, interest and persuasion, which it cannot — and whether you notice the platform has already decided this for you: a submission requires an attested completed screen call, so anything you build sits before the call or it breaks the contract every recruiter is graded on.", "problem": "A screen call does two jobs, checking claims against the bar and selling the move, and today the recruiter pays 45 minutes to discover a must-have fails.", "user": "The recruiter inside a 10-day trial who owes two qualified submissions, with a 7-day slot clock behind them, and cannot afford to spend three calls learning that three of five candidates were never eligible.", "metric": "Recruiter call minutes per submission rated 3 or 4. Guardrail: pre-screen completion rate, because a tool that destroys candidate supply improves the ratio while shrinking the funnel it was meant to feed.", "evidence": "Pull Parascribe transcripts for submissions later rated 1 or 2 and check whether the disqualifying fact was already said out loud on the call. If it was, this is a clock problem, not a screening problem, and a pre-screen fixes nothing. Ask five recruiters to walk their last screen call and mark the questions they ask every single time. Ask whether 1s and 2s cluster inside trial windows.", "options": [{"opt": "Async agent pre-screen on must-haves only, before the recruiter's call, recruiter still calls the survivors and still attests", "verdict": "PICK — it removes wasted calls without touching the parts of the submission contract only a person can sign."}, {"opt": "Agent runs the whole live screen call", "verdict": "REJECT — the submission requires an attested screen call plus confirmed consent and interest, and you cannot outsource convincing someone to change jobs; shipping it means rewriting the rule every recruiter is graded on."}, {"opt": "Agent listens live and prompts the recruiter on unasked must-haves", "verdict": "REJECT — it is the hardest thing on this list to build and it saves zero call minutes, which is the exact cost we are attacking."}, {"opt": "Make Draft for Me's gap flags louder", "verdict": "REJECT — those flags fire after the 45 minutes are already spent."}, {"opt": "Run AI calibration earlier, on the resume alone", "verdict": "REJECT — it grades the paper the recruiter has already read; the failure is in unverified claims, not in the document."}], "demo": "A pre-screen link generated from one role's must-haves. The candidate types answers to five questions. The recruiter sees a verdict card per must-have — met, not met, unclear — each quoting the candidate's own sentence. Then a queue of three pre-screened candidates: one clean, one with an unclear item, one hard fail. Submit stays behind the recruiter's own call and attestation. Static data, no model.", "measure": "Call minutes per 3/4-rated submission, on recruiters randomized in. Confounds: recruiters send the link to their best candidates first, so week one flatters the agent. Candidates willing to finish an async form are more motivated than average, which improves submissions for reasons unrelated to screening. Heavy drop-off raises quality by destroying supply, which reads as a win on a ratio. And a recruiter racing the 7-day slot clock skips the link entirely, so low usage means the clock beat the tool, not that the tool failed. Track completion and usage next to the ratio.", "cut": "Voice, scheduling, live prompting, and sending the link to passive candidates who have agreed to nothing yet. The claim is structured verification before human time, not an AI interviewer.", "trap": "Building an AI interviewer, and treating consent and interest as fields to collect rather than something a person earns and signs their name to."}, {"title": "Gate the submit button", "cluster": "ai", "prompt": "AI calibration tells a recruiter Good, Maybe or Bad before they submit, and the knowledge base promises it never touches their rating. Nothing about the submit button changes based on what it says. Decide whether that is right and show me the version you would defend.", "really_testing": "Whether you will add friction to unproven supply while the volume floors still mandate a submission that day, and whether you notice that making an explicitly no-penalty tool consequential breaks a promise recruiters were given in writing.", "problem": "There is no automated quality gate at submission — the automatic checks are integrity only — so the first quality evaluation any candidate gets is the HM reading the card. We are selling HMs a filter that is actually the HM.", "user": "The unproven recruiter in their first 10-day trial. They produce the submissions this would catch, and they are the supply we are short of, so the gate has to teach rather than punish. The HM benefits but cannot act at submit time.", "metric": "Share of a role's submissions rated 1 or 2, per HM per week. It reuses judgment we already collect and needs no new instrument. Guardrail: absolute count of 3/4-rated submissions per role per week must not fall, because that flow is what HMs are paying for.", "evidence": "Ask for the 1-and-2 rate split by recruiter tenure and by whether calibration was run at all. Ask whether 1/4 ratings cluster on the last day of a trial or the last day of the weekly submission window; if they do, the gate is fighting clocks it cannot beat. Ask ops how often the \"more than 10% rated 1/4\" enforcement trigger actually fires and on whom. Then sit with three HMs, open the Submitted column, and time how long each card takes to judge and what decided it.", "options": [{"opt": "Soft gate for unproven recruiters only: a Bad verdict requires one written line of override, and that line is shown to the HM", "verdict": "PICK — liquidity survives, the recruiter has to author the claim in their own words, every override is labelled training data, and calibration still does not touch their rating, so the written promise holds."}, {"opt": "Hard block on Bad", "verdict": "REJECT — the 8-per-week floor and the 7-day slot clock still demand a submission that day, so it lands on a worse role or the recruiter fails for obeying our own rules."}, {"opt": "Gate every recruiter", "verdict": "REJECT — taxing proven recruiters to fix a new-recruiter problem costs you the supply you cannot replace."}, {"opt": "Keep it advisory and show the verdict to HMs instead", "verdict": "REJECT — it hands filtering back to the HM, which is the problem, and it turns a no-penalty tool into a public rating through the back door."}, {"opt": "Let a recruiter declare \"nothing good this week\" without it counting against the volume floor", "verdict": "REJECT for today — it is the honest fix and I would fight for it next, but changing the floors is a policy and enforcement decision, not a one-day build."}], "demo": "One submit flow for one role. The calibration verdict appears inline with a reason per must-have taken from the HM's rubric. On Bad, the button becomes \"Submit anyway\" and demands one sentence before it enables. Then the HM's card shows that sentence under a small \"overrode a Bad calibration\" flag. Two screens, static data, no model changes.", "measure": "1-and-2 rate per HM per week with the 3/4 volume guardrail, comparing unproven recruiters randomized into the gate against unproven recruiters left alone. Confounds: recruiters learn to earn a Good by rewording the write-up rather than changing who they send, so the verdict drifts within weeks — watch for Good-rate rising while HM ratings do not. Suppressed submissions do not vanish, they reappear on another role, so read platform-wide, not role-wide. The gated cohort is new recruiters whose 1-and-2 rate falls on its own as they learn, so an uncontrolled read credits the gate for ordinary learning. And launch week carries an observation effect where everyone submits carefully because they know we are watching.", "cut": "Retraining the calibration model, the enforcement ladder, Preferred recruiters, and any change to the volume floors, even though the floors are the real cause. That is a policy decision and it belongs in what is next.", "trap": "Hard-blocking on a model verdict, or spending the day redesigning the volume floors instead of shipping a gate that survives them."}, {"title": "Read this one first", "cluster": "ai", "prompt": "HMs open the Submitted column and work through it in whatever order it arrived. We could just tell them which one to read first. Build that and make me believe it.", "really_testing": "Whether you see that ordering HM attention is a supply-side allocation, not an HM convenience — the card read first is the one that reaches a first interview, and interview rate drives recruiter rating, streaks, single-submission allowances and slot retention. Then whether you make the order checkable against the HM's own rubric with a cheap way to disagree.", "problem": "The HM's scarcest input is attention, and we spend it in arrival order, which rewards whoever submitted fastest rather than whoever submitted best.", "user": "The hiring manager at their first review session of the day, with a handful of cards waiting and twenty minutes.", "metric": "Top-card hit rate: share of review sessions where the card we put first is rated 3 or 4. The HM feels it directly — put junk on top twice and they never trust the order again. Pair it with hours the oldest eventual-3/4 candidate sits unread, so we cannot win by floating the obvious 4 in a queue that would have been read anyway. Supply-side guardrail: the spread of interview rate across recruiters on a role must not widen.", "evidence": "Watch three HMs review live, record the order they actually open cards, and write down what they say out loud. Ask whether arrival position already predicts final rating; if it predicts nothing, ranking has real headroom. Ask how many candidates sit past 48 hours in Submitted and how those were eventually rated. Check whether HMs who turned down their volume preference or posted an \"ease off\" note review differently from the rest.", "options": [{"opt": "Rank by predicted rating and show the score", "verdict": "REJECT — a number invites an argument about the number, and the HM has no way to check it against anything they wrote."}, {"opt": "Rank on evidence against the HM's own editable rubric, each card leading with must-haves met and how, quoting the submission or the Parascribe transcript", "verdict": "PICK — the HM wrote the rubric, so the order is their own logic played back to them and every line is checkable in one glance."}, {"opt": "Skip ranking and filter the weak ones out", "verdict": "REJECT — hiding a candidate without the HM's consent burns all the trust the first time you hide a good one, and it silently moves interview credit away from a recruiter who cannot appeal."}, {"opt": "Rank by recruiter rating", "verdict": "REJECT — new recruiters enter at 5.0 on a scale averaging about 4.7, so the signal is blank exactly where you need it most."}, {"opt": "Rank oldest-first to clear staleness", "verdict": "REJECT — it fixes fairness by making the first card worse, and you lose the HM in two sessions."}], "demo": "An HM inbox with five cards and one toggle: arrival order or Paraform order. In Paraform order each card leads with the rubric line items — met with evidence, met by claim, not met — every evidence line quoting the submission or the call transcript, plus one plain sentence saying why this card is first. Every card carries \"Not for me — why?\" with three one-tap reasons, and tapping one visibly reorders the rest of the queue on screen. Ordering is hard-coded. The reorder is the trust moment and it is cheap to fake.", "measure": "Top-card hit rate against a random-order arm, never against history. Confounds: position itself buys generosity, so whatever sits on top is read more kindly and a random ranking will also beat arrival order — which is exactly why the control has to be random rather than historical. HMs who accept the order review faster and rate more coarsely, inflating 3s while the hires get no better, so watch onsite conversion beside ratings. And the ranking changes which recruiter earns interview credit, which changes their allowances and streaks, which changes what they submit next, so the supply mix moves under you within weeks.", "cut": "The model. Rank on rubric-match count with hand-written rules. Also cut cross-role ranking and any auto-reject. What needs proving today is the evidence card and the disagree button, not the scoring.", "trap": "Shipping a confident score with no checkable evidence behind it, disbelieved the first time it is wrong and never trusted again. The second trap is treating this as an HM-side feature and never asking what it does to the recruiters whose interview rate it now decides."}, {"title": "The rubric that learns", "cluster": "ai", "prompt": "Every role starts with a recorded intake call and a rubric the HM can edit. Then the 1-4 ratings and the rejection notes pile up on the role page. We call that our hiring intelligence. Make it mean something.", "really_testing": "Whether you turn a data-flywheel slogan into one closed loop with a human signature in it, whether you check the premise before building it — nothing observed feeds ratings or rejection notes back into a rubric, but ParaAI already re-matches rejected candidates, so part of a loop may exist — and whether you know that a rubric changing without the HM's consent is a bug, not intelligence.", "problem": "The bar for a role moves in the HM's head over the first two weeks. It surfaces only as scattered rejection notes on the role page, which are optional to read and never republished as a rubric change, so everyone recruiting after week one calibrates against a stale spec.", "user": "The recruiter on a primary slot in week two, graded on interview rate against a bar that moved after the intake call. Not the HM: the HM already knows the bar moved. The recruiter is the one paying for not knowing.", "metric": "A role's first-round interview rate in weeks two to four, read on roles where a bar change published against roles where the HM saw a proposed change and dismissed it. The honest expectation today is flat or falling as the easy candidates get spent, so flat on treated roles against a fall on control is still a win.", "evidence": "Take ten roles and diff the must-haves at post time against the rejection reasons on their 1s and 2s in week three, then count how many rejections cite a requirement that was never in the rubric. The product exposes \"Edit candidate rubric\" but we do not know whether any HM has ever used it after posting, so ask. Ask three HMs what they learned from their first ten candidates. And check whether ParaAI's re-matching already consumes rejection feedback: if it does, extend that loop rather than build a second one.", "options": [{"opt": "Agent drafts a rubric change from ratings and rejection notes, shows the HM a diff with the candidates that justify it, HM accepts, edits or dismisses, and accepted changes publish to every slotted recruiter with a date", "verdict": "PICK — the loop closes and a human signs the document recruiters are graded against."}, {"opt": "Update the rubric automatically", "verdict": "REJECT — the rubric is the contract behind ratings, interview rate and slot retention, so an unsigned change makes every rating unappealable."}, {"opt": "Surface the raw rejection feedback to recruiters more loudly", "verdict": "REJECT — it is already on the role page and already optional to read; that is more corpus, not more calibration."}, {"opt": "Let recruiters propose rubric changes", "verdict": "REJECT — it turns calibration into a negotiation with the people being graded."}, {"opt": "Pause the role's trial and slot clocks when the bar changes", "verdict": "REJECT for today — it is the fair thing and the right next fight, but it touches trial and slot enforcement, so it is not a one-day build."}], "demo": "One role page with a \"Bar changes\" panel holding a single proposed change, say adding a must-have, with the three quoted rejection notes that justify it and Accept, Edit, Dismiss. On accept, the must-have list updates, a dated line lands in a change log, and the recruiter view shows a banner: the bar changed two days ago, one update. Finish in the recruiter view, showing what the change means for the two candidates they already have in play. Static, one role, no model.", "measure": "Weeks two-to-four first-round interview rate on roles that published a change against roles where the HM dismissed one. Confounds: candidate supply on a role depletes over its life, so later submissions get worse for reasons unrelated to calibration — never compare a role only against its own week one. HMs who accept diffs are the engaged HMs whose roles already perform better, and the platform even scores HM engagement, so match on that score or the comparison is self-fulfilling. Publishing a change also tells recruiters someone is watching the role, which raises effort by itself. And a tightened bar cuts the denominator, so it can raise interview rate while producing fewer interviews — read absolute first-round interviews alongside the rate.", "cut": "Cross-role learning, detecting the change without HM sign-off, and any re-scoring of candidates already submitted. Cross-role is the compounding story, but one role's loop has to work before intelligence compounds across roles.", "trap": "Building a hiring-insights dashboard nobody acts on instead of one change that publishes and reaches the people being graded by it. The second trap is asserting that nothing feeds back today without checking whether ParaAI's re-matching already does."}, {"title": "First week, first slot", "cluster": "growth", "prompt": "We approve a batch of recruiters every Monday and then the first week basically runs itself. Zach thinks that's fine — good recruiters figure it out. Tell me whether he's right and what you'd change.", "really_testing": "Whether you notice the product's stated activation event — 'submit your first candidate' — is the wrong one, and that the real event is a trial slot converting to Primary. Whether you refuse to ship onboarding polish. And whether you pick a metric that speed cannot fake.", "problem": "A new recruiter's first real act is a 10-day trial needing two qualified submissions, on a starter role the platform picked by a process we have never documented — and her first HM rating lands inside the same trailing two-week interview-rate window that prices her single-submission allowance. We stake her entire opening position on the one input she did not choose.", "user": "The experienced agency recruiter in her first week — arrived with a live book and named three active candidates at signup, which ParaAI already matched against live roles. Pick her over the career-changer: proven supply is the constraint the marketplace actually feels, and she is the one with somewhere else to be on day eight.", "metric": "First-trial conversion at quality: share of each week's approval cohort whose first slot converts trial to Primary within 21 days of approval, with no 1/4 rating along the way. Reject time-to-first-submission — the chrome already says 'typically within 2 days' and optimizing it manufactures the rushed send. Reject 30-day retention — too slow to read and dominated by approval-cohort mix.", "evidence": "Plot first-trial outcome against day-of-first-submission for the last 200 approvals; if the fast senders do not convert better, the speed rail is costing us. Split 60-day survival by first-trial outcome. Ask Zach the two things the research cannot answer: how starter roles are assigned today, and whether the 15-minute onboarding call still happens at current signup volume. Call five recruiters approved last month — which role did you pick first, why that one, and what did you read on the role page before you sent.", "options": [{"opt": "Rebuild the three-task checklist: progress bar, nudge emails, welcome video.", "verdict": "REJECT — it accelerates the one act the product already over-accelerates. The failure is which role she is standing on, not how fast she sends."}, {"opt": "Match starter roles to her: run her max-3 declared taxonomies and her three signup candidates against live roles, and assign only low-density roles with a highly engaged HM.", "verdict": "PICK — every input already exists (signup taxonomies, ParaAI candidate matching, the density and HM-engagement labels Browse renders). Wiring, not modelling, and the only option that changes the input she cannot control."}, {"opt": "Give first-timers a 20-day trial instead of 10.", "verdict": "REJECT — a longer clock on a saturated role buys a later bad submission, and it slows slot turnover for everyone on the waitlist."}, {"opt": "Auto-run AI calibration on a first-timer's first three submissions and block a 'Bad fit' verdict.", "verdict": "REJECT — it gates the candidate after the role choice is already lost, and it turns the one no-penalty advisory tool into a checkpoint, which kills honest use of it. A submission-time gate is its own brief."}], "demo": "One static HTML page, 'Your first role.' Three platform-picked role cards, each with a plain 'why you' line naming the taxonomy hit and which of her three signup candidates matches a stated must-have, plus the density and HM-engagement labels Browse already shows. One panel states what passing means — 2 qualified submissions, 10 days, and the ~60% interview expectation that follows — in one place instead of three. A toggle flips between today's browse-and-guess view and this one. Hardcoded JSON: three roles, one recruiter, three candidates. No backend.", "measure": "First-trial conversion at quality, cohorted by approval week. Three things will fake a result. Approval mix moves on its own — a Connectors fast-track batch or a stricter review week changes cohort quality with no product involved, so hold approval route fixed. Role supply moves — a week heavy with low-density roles lifts the number for free, so index against the density mix of live roles that week. And HMs rate to different standards on rubrics they edit themselves, so cohorts landing at different companies are not comparable; compare within company or fix company mix. Read time-to-first-submission as a guardrail, not a goal: if it collapses, we only built a faster rail.", "cut": "Left the 10-day clock, the 8-per-week floor, and the default 5.0 alone. The 5.0 is the next brief: it hides an unproven source from the only person who can price that risk, and no amount of better role matching fixes it.", "trap": "The weak version ships onboarding polish and reports activation as time-to-first-submission. The number improves, the recruiter still fails her trial, and we have built a faster path to a bad first rating."}, {"title": "Recruiters go quiet", "cluster": "growth", "prompt": "Recruiters who were doing fine stop showing up and we notice weeks later. Zach wants a churn model built. You have today — tell me what you'd actually do.", "really_testing": "Whether you reframe a prediction request as a legibility problem, and whether you notice the fix forces us to commit to windows we currently leave undisclosed. Also whether you pick a churn metric readable inside one quarter.", "problem": "A recruiter is governed by roughly a dozen thresholds — interview rate at 25, 30, 50 and 60 percent for four different consequences, average score 2.5, more than 10% of submissions rated 1/4, plus three volume clocks — and for several of them we have never published the window or the sample size. So the first legible signal that something is wrong is the punishment itself: a reclaimed slot, a dead streak, submissions disabled. The rational response to an unexplained punishment is to leave.", "user": "The mid-tier recruiter: at least one placement, above every floor, not yet Preferred. Pick her over the failing recruiter, whom the system is correctly removing, and over the Preferred recruiter, who has a badge and dedicated support telling her monthly that she is fine.", "metric": "Post-breach survival: of recruiters who hit their first enforcement event in a month — slot reclaimed, streak dead, submissions disabled, account review — the share still holding at least one Primary slot 30 days later. Guardrail, not optional: their interview rate over the same window must not fall, or all we bought is more of the forced marginal submission, which is the disease. Reject raw churn — too slow, and it mixes recruiters we removed on purpose with recruiters who drifted.", "evidence": "Pull the enforcement event log and rank first-breach types by the share followed by silence: slot reclamation, a single 1/4, a dead streak, a 30-day gap flag. Separate deactivations we initiated from people who simply stopped. Ask Zach for the two undisclosed windows this design needs — the sample and window behind the ~60% slot-retention expectation, and whether the 8-per-week floor is enforced at all. Call five recruiters who went quiet within 30 days of a breach and ask what they believed had happened to them.", "options": [{"opt": "Build the churn model: score every recruiter weekly, hand the at-risk list to ops for outreach.", "verdict": "REJECT — it is Zach's ask and the wrong shape. It moves the knowledge to a human who then has to explain rules we have not published, leaves the recruiter blind on Monday, and scales with headcount instead of with recruiters."}, {"opt": "Email her 48 hours before a consequence fires.", "verdict": "REJECT — a warning says a fire is coming, not what puts it out, and 48 hours arrives after the week's sourcing choices are made. The same build cost buys a page that answers both, permanently."}, {"opt": "Ship a Standing page: every rule that governs her, its window, her current value, and the date the next consequence fires — which forces us to pick and publish the two windows we currently leave undisclosed.", "verdict": "PICK — the mechanisms are already measured; only her view of them is missing. The forced window decision is the real value: an unpublished threshold can only be tripped over, never steered toward."}, {"opt": "Loosen the floors — raise the 30-day gap, drop 8-per-week.", "verdict": "REJECT — that re-prices liquidity for every company on a hunch, and liquidity is what companies pay for. It is a defensible experiment later, off a measured baseline, not a same-day answer."}], "demo": "A Standing page: static data plus about 40 lines of JavaScript. One row per governing rule — interview rate against the slot expectation, slot utilization on 7 days, account volume on 30 days, streak at 50%, the Preferred bar at 60/30/2.75 — each with current value, threshold, window, and one plain sentence: 'do nothing and you lose the Ramp slot on Aug 19.' One control, 'add two submissions this week,' recomputes every row live, so runway becomes something she can steer. Two rows are deliberately marked 'window: TBD' — that is the decision the page forces us to make.", "measure": "Post-breach survival, by breach month. Confounds: role supply is seasonal, so a thin-supply month reads as churn — index against live-role count. Showing runway may simply push volume, so read interview rate beside survival rather than after it. And the recruiters who open the page are already the engaged ones, so measure the whole breach cohort, not the viewers; a viewer-only read will look spectacular and mean nothing.", "cut": "Changed no threshold, no window value, no floor. Built nothing for ops, sent no email. Next: consolidate the thresholds themselves — a dozen numbers on six windows is the underlying illegibility, and this page only makes it visible.", "trap": "The weak version builds the model Zach asked for. It scores well, ops calls the top of the list, and nothing the recruiter can see on Monday has changed — so nothing she does changes."}, {"title": "The second req", "cluster": "growth", "prompt": "Companies post one role and then we never see them again. Sales says it's the fee. I don't buy it — go find out what's actually happening and what you'd ship by Friday.", "really_testing": "Whether you check the hired-versus-abandoned split before diagnosing anything, and whether you will turn the HM's advisory volume dial into a binding mechanism knowing it starves recruiter trial clocks. This tradeoff has no free side and you have to name your side.", "problem": "The one control we give the reviewer is a candidate-volume preference, and what it changes downstream is an open question, not a finding. What we do observe is that at least one HM's dial output was a broadcast announcement asking recruiters to ease off — which means for her it did not bind. Meanwhile three supply-side clocks (2-in-10 trials, 7-day slot utilization, 8-per-week accounts) mandate flow at her regardless of what she set.", "user": "The in-house talent lead at a 50-to-200-person company on her first req. She reviews every submission, she edits the rubric, and she owns the budget for the next req. Pick her over the hiring manager, who feels the flood but does not decide, and over the founder, who never opens the pipeline.", "metric": "True north: share of companies posting a second req within 60 days of the first going live, split by whether req one hired. Leading indicator readable in a week: median hours from submission to HM decision in the Submitted stage. Reject submissions per role — that is the variable the design deliberately reduces, so it moves whether or not anything improved. Reject NPS — that asks the flooded person how she feels about the flood.", "evidence": "First, split one-and-done companies into hired and abandoned. If most hired, this is an expansion brief, not a churn brief, and the answer changes completely. Then compare first-seven-day submission counts for repeat versus one-and-done companies, holding role type and fee band fixed. Count how many live roles carry 'ease off' language in HM announcements — a countable proxy for the dial failing. Call four one-and-done talent leads and ask what the last thing that happened was before they stopped.", "options": [{"opt": "Ship employer analytics: time to fill, funnel conversion, source breakdown.", "verdict": "REJECT — it reports a bad experience back to the person who just lived it, and changes nothing about what lands in her Submitted column next week."}, {"opt": "Make the volume preference bind: meter arrivals into a held queue at her stated rate, release on a schedule, and pause the recruiter's trial clock while her queue is full.", "verdict": "PICK — the dial, the arrival readout and the trial clock all exist; the wiring does not. It also settles an open question we have been avoiding: what a 10-day clock does when a role saturates. The cost is honest and stated — recruiters wait, and some leave for roles that do not make them wait."}, {"opt": "Cut the fee on the second req.", "verdict": "REJECT — price is a sales lever on a multi-week cycle, and the only customer complaint we have actually observed is about submission volume, not fee. Revisit only if the evidence split shows abandoned reqs dominate."}, {"opt": "Auto-close roles that go stale.", "verdict": "REJECT — that bills the customer for our own metering failure, and it pulls the role off Browse, which is the one place a recruiter might still have found it."}], "demo": "One page, two panes, one shared state object. Left is the HM pipeline: a dial set to three, six or ten new candidates a week; a Submitted column that never shows more than that; a held queue with a count and a next-release date. Right is the recruiter's card for the same role: 'Queue full. Two openings Thursday. Trial clock paused — 6 days left.' Moving the dial changes both sides at once, which is the point — the demo makes the tradeoff visible instead of hiding it. Fake data, no backend.", "measure": "Second-req rate at 60 days, split by req-one outcome. That split is the whole read: a company that hired fast also stops posting, so an unsplit number confounds success with abandonment and will show whatever you want it to. Second, metering cuts submission count by construction, so any per-submission average rises mechanically — judge on hires per req and time to fill, never on average rating. Third, paused trial clocks change recruiter supply, so watch role fill rate and slot waitlist length; if metering makes the HM happy and the role unfillable, we lost.", "cut": "Did not touch the fee, the 1-to-4 scale, or the rubric. Built no employer reporting. Next, and it is the uncomfortable one: what a paused trial clock does to the waitlist this design makes longer.", "trap": "The weak version builds an employer dashboard and calls retention a reporting gap. The subtler weak version diagnoses flooding correctly, never checks how many one-and-done companies simply hired, and then optimizes churn on a population that mostly succeeded."}, {"title": "Pay the starving roles", "cluster": "growth", "prompt": "We push real money out every week — streaks, challenges, stage rewards — and I can't tell you what it buys. Work out whether we keep paying it, and in what shape.", "really_testing": "Whether you can tell paying for behavior apart from paying for allocation, and whether you leave the fee percentage alone. The fee is the company's price, sold on a weeks-long cycle; it is not a product lever available to you today.", "problem": "Every payout we run is conditioned on quality and on concentration: streaks escalate for going deep on one role and die below a 50% interview rate, challenges require 60%, stage rewards pay for late-round progress. None of them is conditioned on where the role sits in the market. So the budget pays a recruiter to do more of what she already chose, while 'Low recruiter density' sits on Browse as a first-class filter chip — meaning we already know which roles almost nobody is working, and we spend nothing to change that.", "user": "The Preferred or near-Preferred recruiter picking her next role on Monday. She has discretion, unlimited approvals and early access, so hers is the only choice we can actually buy. The floor-bound recruiter takes what is left; paying her to move buys nothing she was not already forced to do.", "metric": "Coverage conversion: share of flagged starving roles that receive a submission rated 3 or 4 within 14 days of flagging, where starving means live 14+ days, carrying the Low density label, and below the median submission count for its salary band. Reject roles filled — too slow and mostly determined by the company. Reject reward spend per hire — minimized by paying nothing, which is a real option but not one that needs a PM.", "evidence": "Rank every live role by days-live against submissions received, then test whether current reward spend correlates with role need at all. If it is flat or negative, the diagnosis is done in one query. Pull roles companies eventually withdrew and measure how long they sat first — that is the revenue we are leaving. Ask Zach for the actual weekly streaks-plus-challenges spend, because the whole proposal is a reallocation of it. Ask five recruiters how they choose a role on Monday, and whether a streak has ever changed that choice.", "options": [{"opt": "Kill streaks and challenges, bank the money.", "verdict": "REJECT — they are the retention machinery for the mid tier and they are already quality-gated at 50% and 60%. You save the budget and lose the people it was holding."}, {"opt": "Point ParaAI and the Browse presets at starving roles: surface them harder, add them to the recommended set.", "verdict": "REJECT as the answer, ship as the free half. It reallocates attention among recruiters who already hold a matching candidate, and a starving role needs someone to go source one. Attention does not pay for a week of sourcing."}, {"opt": "Redirect the challenge budget into a per-role bounty on flagged starving roles, shown on the Browse card next to the fee.", "verdict": "PICK — Browse already leads with money and already renders density, so the bounty rides real estate and a signal that exist. It is the only option that pays for allocation rather than motion, and it is reversible in a week."}, {"opt": "Raise the fee percentage on hard roles.", "verdict": "REJECT — that is the company's price, it needs sales, and it takes weeks. The bottleneck we can observe is which role a recruiter picks, not whether the company would pay more."}, {"opt": "Pay a bonus for every 4-of-4 rating.", "verdict": "REJECT — it pays recruiters against a scale whose calibration we do not control, since each HM edits her own candidate rubric per role. It also rewards quality we already reward, not the allocation we do not."}], "demo": "One page. Twelve fake Browse cards showing fee percent, salary band and density, with a bounty band on the flagged ones: '+$750 for the first submission rated 3 or 4 — 3 days left.' A 'Bounty' filter chip beside the existing presets. Then the piece that matters: a rule builder with three inputs — days live, density, submission floor — where you watch which cards light up and what the week would cost against the current challenge budget. A JSON array of roles and plain JavaScript. No backend.", "measure": "Time to first 3-or-4 submission on flagged roles, before and after. Confounds: roles get flagged because they are stuck, so part of any improvement is regression to the mean — hold a matched set of starving roles unflagged and read the difference, not the level. Bounties move recruiters rather than create them, so watch submission volume on non-bounty roles for the diversion; if it drops one-for-one we bought nothing. And a bounty raises volume on the paid role by design, so read interview rate on bounty roles or we have bought junk at a premium.", "cut": "Left the fee percent, the 30/60/90 installment schedule, the clawback and Connectors alone. Next: whether streaks should fund this instead. They pay for concentration on one role, which is exactly the behavior that leaves other roles empty — but they are also the mid tier's reason to stay, so that is a measured trade, not a Friday decision.", "trap": "The weak version redesigns the fee or invents a points-and-tiers layer. Both feel like pricing work. Neither moves one recruiter onto a starving role on Monday morning."}, {"title": "Agencies as supply blocks", "cluster": "growth", "prompt": "Boutique agencies keep signing up as five separate individuals. Sales wants something to sell them. Work out whether there's a real business here and what it is.", "really_testing": "Whether you find the scarce unit in a two-sided marketplace — slots, not headcount — and design against it, instead of shipping a team workspace and a per-seat price. Also whether you check what 'up to 5 members auto-approved' actually means before you build on top of it.", "problem": "An agency is the fastest way to add proven supply, but every governing object is individual: the rating, the slot, the 10-day trial, the volume floor. So the principal cannot allocate her own people, her juniors enter at a default 5.0 they did not earn, and the firm spends five trial clocks learning what one would have taught. Check one thing first: the KB's 'up to 5 members auto-approved' is our only datum, and we do not know whether that means five platform seats or five slots on one role. The design depends entirely on which.", "user": "The principal of a four-to-eight person boutique with a real book in one taxonomy. She decides who works what and she carries the firm's reputation. Her juniors are not the user; they do what she says.", "metric": "Interviews per slot-week: first-round interviews produced per slot per week, agency-held slots against individual-held slots on matched roles, over 60 days. Slots are the scarce unit, so price the slot. Reject agencies signed — it counts logos and hides the opportunity cost of every seat we handed over. Reject total agency submissions — five people will always out-submit one.", "evidence": "The population already exists, so measure before designing: pull agency-affiliated recruiters today and compare interview rate and slot utilization to individuals, matched on taxonomy, salary band and density. Check whether an agency's members pile onto the same roles and crowd each other out of slots. Get the real answer on what 'up to 5 auto-approved' does today. Ask three principals how they would split five seats across roles if they could choose, and what they would do about a junior's bad submission if the firm's own rating carried it.", "options": [{"opt": "Team account: shared CRM, shared sequences, shared inbox.", "verdict": "REJECT — collaboration tooling that never touches slots, ratings or trials, which is where the failure actually lives. It adds people to a marketplace whose bottleneck is seats on roles."}, {"opt": "The agency slot: the firm holds the slot, the principal assigns and reassigns who works it, and the firm carries one pooled rating she is accountable for.", "verdict": "PICK — reuses slots, trials and ratings unchanged, installs the submission-time quality check the platform does not have and staffs it with the one person who has money on the outcome, and converts five trial clocks into one."}, {"opt": "Let the principal's track record set her juniors' starting ratings.", "verdict": "REJECT — it moves reputation without accountability, which is the default-5.0 problem with extra steps. Pooling is the same idea done properly, because a pooled rating moves in both directions."}, {"opt": "Pool candidate ownership across the firm so members stop blocking each other at the same company.", "verdict": "REJECT for now, and it is the closest call here. Ownership is company-scoped for 12 months and every dispute is arbitrated against it; rewriting the rule that adjudicates the whole marketplace is not a same-week change. Ship the agency slot first and let it produce the collision data that justifies this."}, {"opt": "Volume discount on the fee for agency-sourced hires.", "verdict": "REJECT — it pays the supply side for being large when we are short of good, not short of big. Worse, the fee is what the company pays us, so the discount lands on the company, not on the agency we are supposedly selling to."}], "demo": "An agency console: one state object, no backend. The firm holds three role slots; the principal assigns a team member to each from a dropdown and can reassign mid-trial, with the trial clock and the assignee's name on every slot. A pooled firm rating updates as you click in fake submission outcomes, so one junior's 2-of-4 visibly moves the whole firm's number. Beside it, the HM's view of the same firm: one card reading 'Acme Search — 4.6, 12 placements' instead of five identical 5.0s. Four screens' worth of state, buildable in an afternoon.", "measure": "Interviews per slot-week and interview rate, agency slots against individual slots. Confounds: agencies apply to roles they already know they can win, so a raw comparison flatters them — match on taxonomy, salary band and density, and prefer roles where both types hold slots at the same time. Members share candidates, so the 12-month company-scoped ownership rule will move submission counts for reasons that have nothing to do with performance. And a pooled rating regresses toward the middle by construction, so a firm dropping from 5.0 to 4.6 is arithmetic, not decline; compare pooled ratings only against other pooled ratings.", "cut": "No shared CRM, no shared sequences, no agency billing, no change to the fee. Next: what happens when a pooled rating falls through an enforcement floor. If all five seats go at once, no principal will accept a pooled rating and the whole design collapses — so that question decides whether this ships at all.", "trap": "The weak version builds the team workspace Sales asked for and prices it per seat. It adds five people to a marketplace whose bottleneck is slots, so the agency's members compete against each other on one role, and the principal still cannot stop the worst submission from going out under her name."}];

/* ---------- state ---------- */
const K='pfdeck';
const S=JSON.parse(localStorage.getItem(K)||'{}');
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cur=0, openDrawer=null;

/* ---------- render ---------- */
const stage=document.getElementById('stage');
SLIDES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide'; el.id='s'+i;
  const ed=(key,cls,ph,tag)=>`<${tag||'div'} class="${cls}" contenteditable data-ph="${esc(ph)}" data-k="${i}-${key}">${esc(S[i+'-'+key]||'')}</${tag||'div'}>`;
  let body='';
  if(s.kind==='title'){
    body = ed('h','h serif',s.h) + ed('sub','sub',s.sub);
  } else if(s.kind==='quote'){
    body = ed('h','h serif',s.h) + `<div style="margin-top:38px">` + ed('q','q',s.q) + ed('qa','qa',s.qa) + `</div>`;
  } else {
    body = ed('h','h serif',s.h) + ed('sub','sub',s.sub) + '<div class="bl">' +
      s.b.map((ph,j)=>`<div class="b"><div class="dot"></div>${ed('b'+j,'tx',ph)}</div>`).join('') + '</div>';
  }
  el.innerHTML = `<div class="kick">${esc(s.kick)}${s.k2?` <span class="pn">· ${esc(s.k2)}</span>`:''}</div>`
    + body
    + `<div class="foot"><span>Paraform · work trial</span><span class="no">${i+1} / ${SLIDES.length}</span></div>`;
  stage.appendChild(el);
});

document.querySelectorAll('[contenteditable]').forEach(el=>{
  el.addEventListener('input',()=>{S[el.dataset.k]=el.innerText;save();paintStrip();});
  el.addEventListener('keydown',e=>e.stopPropagation());
  el.addEventListener('paste',e=>{
    e.preventDefault();
    document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'));
  });
});

const strip=document.getElementById('strip');
SLIDES.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='th'; b.id='th'+i; b.onclick=()=>show(i);
  strip.appendChild(b);
});
function paintStrip(){
  SLIDES.forEach((s,i)=>{
    const t=document.getElementById('th'+i);
    const h=(S[i+'-h']||'').trim();
    t.className='th'+(i===cur?' on':'')+(h?' filled':'');
    t.innerHTML=`<div class="tk">${esc(s.kick)}</div><div class="tt">${esc(h||s.h)}</div>`;
  });
}

/* ---------- nav + scale ---------- */
function show(i){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  SLIDES.forEach((_,j)=>document.getElementById('s'+j).classList.toggle('on',j===cur));
  document.getElementById('pos').textContent=(cur+1)+' / '+SLIDES.length;
  paintStrip(); fit();
  const t=document.getElementById('th'+cur); if(t) t.scrollIntoView({block:'nearest',inline:'center'});
}
function go(d){show(cur+d);}
function fit(){
  const el=document.getElementById('s'+cur); if(!el) return;
  const st=document.getElementById('stage').getBoundingClientRect();
  const pad = document.body.classList.contains('present') ? 0 : 22;
  const w=st.width-pad*2, h=st.height-pad*2;
  el.style.transform='scale('+Math.max(.1,Math.min(w/1280,h/720))+')';
}
function refit(){ requestAnimationFrame(()=>requestAnimationFrame(fit)); }
window.addEventListener('resize',fit);

function present(on){
  document.body.classList.toggle('present',on);
  if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  else if(!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  if(on) drawer(null);
  refit();
}
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) document.body.classList.remove('present'); refit(); });

document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}
  else if(e.key==='Escape'){present(false);drawer(null);}
  else if(e.key==='p'||e.key==='P'){present(!document.body.classList.contains('present'));}
  else if(e.key==='Home'){show(0);} else if(e.key==='End'){show(SLIDES.length-1);}
});

/* ---------- drawers ---------- */
function drawer(which){
  openDrawer = (openDrawer===which)?null:which;
  document.getElementById('dr-notes').classList.toggle('on',openDrawer==='notes');
  document.getElementById('dr-prac').classList.toggle('on',openDrawer==='prac');
  document.getElementById('notesbtn').classList.toggle('on',openDrawer==='notes');
  document.getElementById('pracbtn').classList.toggle('on',openDrawer==='prac');
  document.body.classList.toggle('dopen',!!openDrawer);
  if(openDrawer==='notes') loadNotes();
  setTimeout(fit,190);
}

function loadNotes(){
  let W={}; try{ W=JSON.parse(localStorage.getItem('wt')||'{}'); }catch(e){}
  const box=document.getElementById('notesbody');
  let html='';
  if(W.sum){
    const d=W.sum;
    html+='<div class="sm"><div class="hd">'+esc(d.headline||'')+'</div>';
    if((d.themes||[]).length){html+='<div class="sl">Themes</div><ul>'+d.themes.map(t=>'<li><b>'+esc(t.t)+'</b> — '+esc(t.why)+'</li>').join('')+'</ul>';}
    if((d.quotes||[]).length){html+='<div class="sl">Quotes</div><ul>'+d.quotes.map(q=>'<li>"'+esc(q.text)+'" — '+esc(q.who)+'</li>').join('')+'</ul>';}
    if((d.gaps||[]).length){html+='<div class="sl">Still missing</div><ul>'+d.gaps.map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul>';}
    html+='</div>';
  }
  const GEN={scratch:'Scratchpad',people:'People',product:'Product observations',questions:'Questions',cut:'Parking lot'};
  let any=false, sec='';
  Object.keys(W).filter(k=>k.startsWith('n-')).sort((a,b)=>+a.slice(2)-+b.slice(2)).forEach(k=>{
    const v=(W[k]||'').trim(); if(!v) return; any=true;
    sec+='<div class="nsec"><span class="nn">block '+(+k.slice(2)+1)+'</span><div class="nt">'+esc(v)+'</div></div>';
  });
  Object.keys(GEN).forEach(g=>{
    const v=(W['g-'+g]||'').trim(); if(!v) return; any=true;
    sec+='<div class="nsec"><span class="nn">'+GEN[g]+'</span><div class="nt">'+esc(v)+'</div></div>';
  });
  html += any ? sec : (W.sum?'':'<div class="none">No notes found. They live on samfinegold.me/paraform-day in this same browser — use the same browser all day and they show up here.</div>');
  box.innerHTML=html;
}

/* ---------- practice ---------- */
function renderPractice(){
  const box=document.getElementById('pracbody');
  if(S.pracKilled){ box.innerHTML='<div class="none">Removed. Reload the page to bring them back.</div>'; return; }
  if(!PRACTICE.length){ box.innerHTML='<div class="none">No practice briefs loaded.</div>'; return; }
  box.innerHTML='<div class="none" style="margin-bottom:10px">'+PRACTICE.length+' briefs Paraform could plausibly hand you. Read the prompt, close your eyes, answer out loud, then open the outline. Hit Remove before you present.</div>'
    + PRACTICE.map((p,i)=>`<div class="pr" id="pr${i}">
      <div class="ph" onclick="document.getElementById('pr${i}').classList.toggle('open')">
        <div class="pt">${esc(p.title)}</div><span class="cl">${esc(p.cluster)}</span></div>
      <div class="pb">
        <div class="say">"${esc(p.prompt)}"</div>
        <div class="k">Really testing</div><div class="v">${esc(p.really_testing)}</div>
        <div class="k">Problem</div><div class="v">${esc(p.problem)}</div>
        <div class="k">User</div><div class="v">${esc(p.user)}</div>
        <div class="k">Metric</div><div class="v">${esc(p.metric)}</div>
        <div class="k">Evidence to get</div><div class="v">${esc(p.evidence)}</div>
        <div class="k">Options</div>${(p.options||[]).map(o=>`<div class="opt${/^PICK/i.test(o.verdict)?' pick':''}">${esc(o.opt)} — ${esc(o.verdict)}</div>`).join('')}
        <div class="k">Build &amp; demo</div><div class="v">${esc(p.demo)}</div>
        <div class="k">Measure</div><div class="v">${esc(p.measure)}</div>
        <div class="k">Cut</div><div class="v">${esc(p.cut)}</div>
        <div class="trap"><b>Trap:</b> ${esc(p.trap)}</div>
      </div></div>`).join('');
}
function killPractice(){
  if(!confirm('Remove the practice briefs? Reloading the page brings them back.')) return;
  S.pracKilled=true; save(); renderPractice();
  document.getElementById('pracbtn').style.display='none';
  drawer(null);
}

/* ---------- timer ---------- */
let tLeft=25*60, tOn=false, tInt=null;
function paintTimer(){
  const m=Math.floor(Math.abs(tLeft)/60), s=Math.abs(tLeft)%60;
  const txt=(tLeft<0?'-':'')+m+':'+String(s).padStart(2,'0');
  const el=document.getElementById('timer'), pl=document.getElementById('ptimer');
  el.textContent=txt; pl.textContent=txt;
  el.className='clk'+(tLeft<0?' over':(tLeft<300?' warn':''));
}
function toggleTimer(){
  tOn=!tOn;
  if(tOn){ tInt=setInterval(()=>{tLeft--;paintTimer();},1000); }
  else clearInterval(tInt);
}
function resetTimer(){ clearInterval(tInt); tOn=false; tLeft=25*60; paintTimer(); }

/* ---------- init ---------- */
show(0); paintTimer(); renderPractice();
if(PRACTICE.length===0) document.getElementById('pracbtn').style.display='none';
</script>
